workflows:
  test-apk-build:
    name: Build Test APK
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  signed-android-aab:
    name: Signed Android AAB
    instance_type: mac_mini_m2
    max_build_duration: 60

    when:
      condition: env.CM_BRANCH == "main"

    environment:
      groups:
        - keystore_credentials
      flutter: 3.44.9
      java: 17
      ndk: 28.2.13676358

    scripts:
      - name: Enforce protected release branch
        script: |
          set -euo pipefail
          test "${CM_BRANCH:-}" = "main"
          test "${CM_PULL_REQUEST:-false}" != "true"
      - name: Set up Android SDK and Flutter paths
        script: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" >> "$CM_BUILD_DIR/android/local.properties"

      - name: Get locked Flutter packages
        script: |
          set -euo pipefail
          flutter pub get --enforce-lockfile

      - name: Build signed release AAB
        script: |
          set -euo pipefail

          : "${CM_KEYSTORE_BASE64:?Missing CM_KEYSTORE_BASE64}"
          : "${CM_KEYSTORE_PASSWORD:?Missing CM_KEYSTORE_PASSWORD}"
          : "${CM_KEY_ALIAS:?Missing CM_KEY_ALIAS}"
          : "${CM_KEY_PASSWORD:?Missing CM_KEY_PASSWORD}"

          KEYSTORE_PATH="$CM_BUILD_DIR/android/app/codemagic-upload-keystore.jks"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          encoded = "".join(os.environ["CM_KEYSTORE_BASE64"].split())
          keystore = base64.b64decode(encoded, validate=True)
          path = Path(os.environ["CM_BUILD_DIR"]) / "android" / "app" / "codemagic-upload-keystore.jks"
          path.write_bytes(keystore)
          PY

          chmod 600 "$KEYSTORE_PATH"

          export ORG_GRADLE_PROJECT_releaseStoreFile="$KEYSTORE_PATH"
          export ORG_GRADLE_PROJECT_releaseStorePassword="$CM_KEYSTORE_PASSWORD"
          export ORG_GRADLE_PROJECT_releaseKeyAlias="$CM_KEY_ALIAS"
          export ORG_GRADLE_PROJECT_releaseKeyPassword="$CM_KEY_PASSWORD"

          flutter build appbundle --release --obfuscate --split-debug-info=symbols/ --build-name=3.3.10 --build-number=133

      - name: Verify AAB and record SHA-256
        script: |
          set -euo pipefail
          AAB_PATH="$CM_BUILD_DIR/build/app/outputs/bundle/release/app-release.aab"
          test -s "$AAB_PATH"
          test -d "$CM_BUILD_DIR/symbols"
          find "$CM_BUILD_DIR/symbols" -type f -print -quit | grep -q .

          jarsigner -verify -strict "$AAB_PATH" >/dev/null

          mkdir -p "$CM_BUILD_DIR/release-metadata"
          AAB_SHA256="$(shasum -a 256 "$AAB_PATH" | awk '{print $1}')"
          printf '%s  %s\n' "$AAB_SHA256" "app-release.aab" \
            > "$CM_BUILD_DIR/release-metadata/SHA256SUMS.txt"
          echo "AAB SHA-256: $AAB_SHA256"

    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - symbols/**
      - release-metadata/SHA256SUMS.txt
