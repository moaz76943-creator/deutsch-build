# DEUTSCH بالعربي | private Flutter application
# CONFIGURATION CANDIDATE: safe/manual by default.
# GitHub default branch is main; Mergify reads this config from main.
# The queue targets main. staging/v2-full-platform does not exist.
# Do not activate automatic queuing until protection and hosted CI are verified.
merge_queue:
  mode: serial
  max_parallel_checks: 1
  reset_on_external_merge: always
  skip_intermediate_results: false
  queued_label: mergify-queued
  dequeued_label: mergify-dequeued
  status_comments: outcomes

queue_rules:
  - name: verified-private-staging
    merge_method: squash
    batch_size: 1
    max_checks_retries: 0
    queue_conditions:
      - base = main
      - -draft
      - -conflict
      - label = mergify-approved
      - check-success = architectural-guard
      - check-success = flutter-pr-merge-gate
    merge_conditions:
      - check-success = architectural-guard
      - check-success = flutter-pr-merge-gate
      - "#approved-reviews-by >= 1"

priority_rules:
  - name: reviewed-staging-hotfix
    conditions:
      - label = mergify-priority-high
      - label = mergify-approved
    priority: high

merge_protections_settings:
  reporting_method: check-runs
  post_comment: true
  # auto_merge_conditions intentionally omitted: no unattended merges.

merge_protections:
  - name: private-flutter-staging-gate
    if:
      - base = main
    success_conditions:
      - -draft
      - -conflict
      - label = mergify-approved
      - check-success = architectural-guard
      - check-success = flutter-pr-merge-gate
      - "#approved-reviews-by >= 1"
