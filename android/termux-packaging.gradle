// Flutter 3.44 injects an empty CMake project solely to download the host NDK
// for stripping already-built JNI libraries. Google host tools cannot run on
// Android/Bionic. Termux packages those libraries intact; R8/Dart remain enabled.
ext.configureTermuxPackaging = { androidExtension ->
    def prefix = System.getenv('PREFIX') ?: ''
    if (!(prefix ==~ /\/data\/data\/[^\/]+\/files\/usr/)) {
        return false
    }
    def cmake = androidExtension.externalNativeBuild.cmake
    def source = cmake.path
    if (source != null) {
        def flutterPlaceholder = source.canonicalPath.endsWith(
            '/packages/flutter_tools/gradle/src/main/scripts/CMakeLists.txt') &&
            source.isFile() && source.readLines().every { !it.trim() || it.trim().startsWith('#') }
        if (!flutterPlaceholder) {
            throw new GradleException('Termux packaging requires prebuilt JNI libraries; an actual native CMake build needs a supported host toolchain.')
        }
        cmake.path = null
    }
    androidExtension.packaging.jniLibs.keepDebugSymbols.add('**/*.so')
    if (project.findProperty('target-platform') == null) {
        project.ext.set('target-platform', 'android-arm64')
    }
    if (project.findProperty('extra-gen-snapshot-options') == null) {
        project.ext.set('extra-gen-snapshot-options', '--strip')
    }
    return true
}
