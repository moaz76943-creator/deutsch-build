plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

apply from: rootProject.file('release-signing.gradle')
def releaseSigning = resolveReleaseSigning()
def hasReleaseSigning = releaseSigning.values().every { it != null && it.toString().trim() }

def releaseTaskRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase(java.util.Locale.ROOT).contains('release')
}
if (releaseTaskRequested && !hasReleaseSigning) {
    throw new GradleException(
        'Release signing is mandatory. Configure releaseStoreFile, ' +
        'releaseStorePassword, releaseKeyAlias, and releaseKeyPassword, ' +
        'or run bash scripts/local-release.sh to prepare ~/.gradle/release-key.jks.'
    )
}

android {
    namespace "com.deutschbilarabi.app"
    compileSdk 36
    // ndkVersion disabled

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.deutschbilarabi.app"
        minSdkVersion flutter.minSdkVersion
        targetSdk 36
        versionCode 133
        versionName "3.3.10"
    }

    signingConfigs {
        secureRelease {
            if (hasReleaseSigning) {
                storeFile = file(releaseSigning.releaseStoreFile)
                storePassword = releaseSigning.releaseStorePassword
                keyAlias = releaseSigning.releaseKeyAlias
                keyPassword = releaseSigning.releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.secureRelease
        }
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
}

flutter {
    source "../.."
}
