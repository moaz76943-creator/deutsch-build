plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.deutschbilarabi.app"
    compileSdk 36 // استخدام إصدار مستقر
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.deutschbilarabi.app"
        // نرفع الإصدار لـ 21 فقط لدعم SQLite و TTS
        minSdkVersion flutter.minSdkVersion
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        
        // تفعيل Multidex بأبسط شكل ممكن
        multiDexEnabled true 
    }

    // Read signing config via external gradle script
    apply from: rootProject.file('release-signing.gradle')
    def releaseSigningConfig = resolveReleaseSigning()

    if (releaseSigningConfig.releaseStoreFile) {
        signingConfigs {
            release {
                storeFile file(releaseSigningConfig.releaseStoreFile)
                storePassword releaseSigningConfig.releaseStorePassword
                keyAlias releaseSigningConfig.releaseKeyAlias
                keyPassword releaseSigningConfig.releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            if (releaseSigningConfig.releaseStoreFile) {
                signingConfig signingConfigs.release
            } else {
                // Task Definition of Done: No release debug-signing fallback.
                signingConfig null
            }
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // نعتمد فقط على multidex الأساسي بدون مكتبات Desugaring المعقدة
    implementation 'androidx.multidex:multidex:2.0.1'
}
