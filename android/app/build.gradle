plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

apply from: rootProject.file('release-signing.gradle')
def releaseSigning = resolveReleaseSigning()
def hasReleaseSigning = releaseSigning.values().every { it != null && it.toString().trim() }
def androidToolchain = new Properties()
rootProject.file('../toolchain.lock').withInputStream { androidToolchain.load(it) }

def releaseTaskRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase(java.util.Locale.ROOT).contains('release')
}
if (releaseTaskRequested && !hasReleaseSigning) {
    throw new GradleException(
        'Release signing is mandatory. Configure releaseStoreFile, ' +
        'releaseStorePassword, releaseKeyAlias, and releaseKeyPassword, ' +
        'or run bash scripts/local-release.sh to prepare ~/.gradle/release-key.jks.'
    )
}

android {
    namespace "com.deutschbilarabi.app"
    compileSdk 36
    buildToolsVersion androidToolchain.getProperty('ANDROID_BUILD_TOOLS_VERSION')
    ndkVersion androidToolchain.getProperty('ANDROID_NDK_VERSION')

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.deutschbilarabi.app"
        // تحديث إصدار Android ليوافق محركات النطق وقاعدة البيانات
        minSdkVersion 21
        targetSdk 36
        versionCode 133
        versionName "3.3.10"
        
        // تفعيل خاصية MultiDex لتجنب خطأ الـ 64k
        multiDexEnabled true

        // Flutter's defaults also include dependency JNI libraries for other ABIs.
        // Honor a single ARM64 request without changing universal/split builds.
        def phoneHost = (System.getenv('PREFIX') ?: '') ==~ /\/data\/data\/[^\/]+\/files\/usr/
        if ((project.findProperty('target-platform') == 'android-arm64' || phoneHost) &&
                project.findProperty('split-per-abi')?.toString() != 'true') {
            ndk {
                abiFilters.clear()
                abiFilters.add('arm64-v8a')
            }
        }
    }

    signingConfigs {
        secureRelease {
            if (hasReleaseSigning) {
                storeFile = file(releaseSigning.releaseStoreFile)
                storePassword = releaseSigning.releaseStorePassword
                keyAlias = releaseSigning.releaseKeyAlias
                keyPassword = releaseSigning.releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.secureRelease
        }
    }
}

apply from: rootProject.file('termux-packaging.gradle')
configureTermuxPackaging(android)

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    // إضافة مكتبة multidex
    implementation 'androidx.multidex:multidex:2.0.1'
}

flutter {
    source "../.."
}
