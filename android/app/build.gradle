plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

apply from: '../release-signing.gradle'

def releaseSigning = project.ext.resolveReleaseSigning()
def hasReleaseSigning = releaseSigning.releaseStoreFile &&
        releaseSigning.releaseStorePassword &&
        releaseSigning.releaseKeyAlias &&
        releaseSigning.releaseKeyPassword
def releaseTaskRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase().contains('release')
}
if (releaseTaskRequested && !hasReleaseSigning) {
    throw new GradleException(
        'Release signing is mandatory. Set releaseStoreFile, releaseStorePassword, releaseKeyAlias, and releaseKeyPassword.'
    )
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Play Integrity Cloud Project Number (from local.properties or env). Required for release.
def cloudProjectNumber = localProperties.getProperty('CLOUD_PROJECT_NUMBER')
        ?: System.getenv('CLOUD_PROJECT_NUMBER')
        ?: project.findProperty('CLOUD_PROJECT_NUMBER')
        ?: '0'
if (releaseTaskRequested && (cloudProjectNumber == null || cloudProjectNumber == '0' || cloudProjectNumber.trim().isEmpty())) {
    throw new GradleException(
        'Play Integrity Cloud Project Number is mandatory for release builds. Set CLOUD_PROJECT_NUMBER in local.properties or as environment variable (get it from Play Console > App integrity > Play Integrity API).'
    )
}
def cloudProjectNumberLong = cloudProjectNumber.toLong()

android {
    namespace "com.deutschbilarabi.app"
    compileSdk 34 // stable version

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.deutschbilarabi.app"
        minSdkVersion flutter.minSdkVersion
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
        buildConfigField "long", "CLOUD_PROJECT_NUMBER", "${cloudProjectNumberLong}L"
    }

    signingConfigs {
        secureRelease {
            def releaseSigning = project.ext.resolveReleaseSigning()
            if (releaseSigning.releaseStoreFile) {
                storeFile file(releaseSigning.releaseStoreFile)
                storePassword releaseSigning.releaseStorePassword
                keyAlias releaseSigning.releaseKeyAlias
                keyPassword releaseSigning.releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            // Enable R8 full mode: code shrinking, obfuscation, and optimization
            // Improves cold-start time, reduces memory usage and APK size.
            // Security is strengthened by class/method renaming (obfuscation).
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.secureRelease
        }
    }

    buildFeatures {
        buildConfig true
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.google.android.play:integrity:1.4.0'
    // Baseline Profiles for faster startup and reduced jank (ART optimization)
    implementation 'androidx.profileinstaller:profileinstaller:1.3.1'
}
