plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def hasReleaseSigning = [
    'releaseStoreFile',
    'releaseStorePassword',
    'releaseKeyAlias',
    'releaseKeyPassword',
].every { project.hasProperty(it) }

def releaseTaskRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase(java.util.Locale.ROOT).contains('release')
}
if (releaseTaskRequested && !hasReleaseSigning) {
    throw new GradleException(
        'Release signing is mandatory. Configure releaseStoreFile, ' +
        'releaseStorePassword, releaseKeyAlias, and releaseKeyPassword.'
    )
}

android {
    namespace "com.deutschbilarabi.app"
    compileSdk 36
    // ndkVersion disabled

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.deutschbilarabi.app"
        minSdkVersion flutter.minSdkVersion
        targetSdk 36
        versionCode 133
        versionName "3.3.10"
    }

    signingConfigs {
        secureRelease {
            if (hasReleaseSigning) {
                storeFile = file(project.property('releaseStoreFile'))
                storePassword = project.property('releaseStorePassword')
                keyAlias = project.property('releaseKeyAlias')
                keyPassword = project.property('releaseKeyPassword')
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.secureRelease
        }
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
}

flutter {
    source "../.."
}
