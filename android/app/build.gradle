plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.deutschbilarabi.app"
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.deutschbilarabi.app"
        // نرفع الإصدار لـ 21 فقط لدعم SQLite و TTS
        minSdkVersion flutter.minSdkVersion
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        // تفعيل Multidex بأبسط شكل ممكن
        multiDexEnabled true
    }

            signingConfigs {
        secureRelease {
            def keystorePropertiesFile = rootProject.file('key.properties')
            def keystoreProperties = new Properties()
            if (keystorePropertiesFile.exists()) {
                keystorePropertiesFile.withInputStream { stream ->
                    keystoreProperties.load(stream)
                }
            }
            def keyFilePath = project.findProperty('releaseStoreFile') ?: keystoreProperties['storeFile']
            if (keyFilePath) {
                def keyFile = file(keyFilePath)
                if (!keyFile.exists() && rootProject.file(keyFilePath).exists()) {
                    keyFile = rootProject.file(keyFilePath)
                }
                storeFile keyFile
                storePassword (project.findProperty('releaseStorePassword') ?: keystoreProperties['storePassword'])
                keyAlias (project.findProperty('releaseKeyAlias') ?: keystoreProperties['keyAlias'])
                keyPassword (project.findProperty('releaseKeyPassword') ?: keystoreProperties['keyPassword'])
            }
        }
        release {
            initWith(signingConfigs.secureRelease)
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.secureRelease
            minifyEnabled false
            shrinkResources false
        }
    }
}
flutter {
    source '../..'
}

dependencies {
    // نعتمد فقط على multidex الأساسي بدون مكتبات Desugaring المعقدة
    implementation 'androidx.multidex:multidex:2.0.1'
}
