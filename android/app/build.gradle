plugins { id "com.android.application"; id "org.jetbrains.kotlin.android"; id "dev.flutter.flutter-gradle-plugin" }

def hasReleaseSigning = [
    'releaseStoreFile',
    'releaseStorePassword',
    'releaseKeyAlias',
    'releaseKeyPassword',
].every { project.hasProperty(it) }

android {
    namespace "com.deutschbilarabi.app"
    compileSdk 36
    ndkVersion "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.deutschbilarabi.app"
        minSdkVersion flutter.minSdkVersion
        targetSdk 36
        versionCode 132
        versionName "3.3.9"
    }

    signingConfigs {
        secureRelease {
            if (hasReleaseSigning) {
                storeFile = file(project.property('releaseStoreFile'))
                storePassword = project.property('releaseStorePassword')
                keyAlias = project.property('releaseKeyAlias')
                keyPassword = project.property('releaseKeyPassword')
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseSigning ? signingConfigs.secureRelease : signingConfigs.debug
        }
    }
}

flutter { source "../.." }

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
