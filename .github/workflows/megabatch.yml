name: "Megabatch Runner"

on:
  workflow_dispatch:
    inputs:
      batch_number:
        description: "رقم الحزمة"
        required: true
        default: "2"

permissions:
  contents: write

jobs:
  run-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: "Apply Megabatch 2 - Concurrency and Audio"
        run: |
          mkdir -p lib/core/concurrency lib/core/audio

          cat << 'DART' > lib/core/concurrency/cancellation_token.dart
          class CancellationToken {
            bool _isCancelled = false;
            final List<void Function()> _listeners = [];

            bool get isCancelled => _isCancelled;

            void cancel() {
              if (_isCancelled) return;
              _isCancelled = true;
              for (final listener in _listeners) {
                listener();
              }
              _listeners.clear();
            }

            void onCancel(void Function() callback) {
              if (_isCancelled) {
                callback();
              } else {
                _listeners.add(callback);
              }
            }

            void throwIfCancelled() {
              if (_isCancelled) {
                throw StateError('Operation was cancelled by user or timeout');
              }
            }
          }
          DART

          cat << 'DART' > lib/core/concurrency/worker_task.dart
          import 'dart:async';
          import 'cancellation_token.dart';

          class WorkerTask<T> {
            final String taskId;
            final Future<T> Function(CancellationToken token) execute;
            final Duration timeout;

            const WorkerTask({
              required this.taskId,
              required this.execute,
              this.timeout = const Duration(seconds: 30),
            });
          }
          DART

          cat << 'DART' > lib/core/audio/audio_session_coordinator.dart
          enum AudioPlaybackState { idle, buffering, playing, paused, ducked, stopped }

          class AudioSessionCoordinator {
            AudioPlaybackState _state = AudioPlaybackState.idle;
            String? _activeAudioId;

            AudioPlaybackState get state => _state;
            String? get activeAudioId => _activeAudioId;

            bool requestFocus(String audioId) {
              if (_state == AudioPlaybackState.playing && _activeAudioId != audioId) {
                stopCurrent();
              }
              _activeAudioId = audioId;
              _state = AudioPlaybackState.playing;
              return true;
            }

            void duck() {
              if (_state == AudioPlaybackState.playing) {
                _state = AudioPlaybackState.ducked;
              }
            }

            void restoreVolume() {
              if (_state == AudioPlaybackState.ducked) {
                _state = AudioPlaybackState.playing;
              }
            }

            void stopCurrent() {
              _state = AudioPlaybackState.stopped;
              _activeAudioId = null;
            }
          }
          DART

          cat << 'DART' > lib/core/audio/audio_cache_manifest.dart
          class AudioEntry {
            final String audioKey;
            final String localPath;
            final int fileSizeBytes;
            final int lastVerifiedEpoch;

            const AudioEntry({
              required this.audioKey,
              required this.localPath,
              required this.fileSizeBytes,
              required this.lastVerifiedEpoch,
            });

            bool get isValid => fileSizeBytes > 0 && localPath.isNotEmpty;
          }

          class AudioCacheManifest {
            final Map<String, AudioEntry> _cache = {};

            void register(AudioEntry entry) {
              if (entry.isValid) {
                _cache[entry.audioKey] = entry;
              }
            }

            AudioEntry? getEntry(String key) => _cache[key];
            bool contains(String key) => _cache.containsKey(key);
            int get totalCachedFiles => _cache.length;
          }
          DART

          dart analyze \
            lib/core/concurrency/cancellation_token.dart \
            lib/core/concurrency/worker_task.dart \
            lib/core/audio/audio_session_coordinator.dart \
            lib/core/audio/audio_cache_manifest.dart

      - name: "Commit and Push"
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/
          git commit -m "feat(megabatch-2): concurrency and audio architecture" || exit 0
          git push
