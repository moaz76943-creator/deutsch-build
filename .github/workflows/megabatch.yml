name: "Megabatch Runner"

on:
  workflow_dispatch:
    inputs:
      batch_number:
        description: "رقم الحزمة"
        required: true
        default: "3"

permissions:
  contents: write

jobs:
  run-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: "Apply Megabatch 3 - UI Contracts, Design Tokens and 3D Cards"
        run: |
          mkdir -p lib/core/ui/tokens lib/core/ui/contracts

          # 1. AppSpacing (402, 403, 404, 405)
          cat << 'DART' > lib/core/ui/tokens/app_spacing.dart
          /// شبكة المسافات القياسية لتوحيد التصميم وتجنب الأرقام العشوائية
          class AppSpacing {
            static const double none = 0.0;
            static const double xxs = 2.0;
            static const double xs = 4.0;
            static const double sm = 8.0;
            static const double md = 12.0;
            static const double lg = 16.0;
            static const double xl = 20.0;
            static const double xxl = 24.0;
            static const double xxxl = 32.0;
            static const double huge = 48.0;

            static const double cardRadiusSm = 8.0;
            static const double cardRadiusMd = 14.0;
            static const double cardRadiusLg = 20.0;
            static const double buttonRadius = 12.0;
          }
          DART

          # 2. AppMotionTokens (412, 413, 414, 415)
          cat << 'DART' > lib/core/ui/tokens/app_motion.dart
          /// ثوابت الحركة التفاعلية لتوفير تجربة بصرية 60fps مستقرة
          class AppMotion {
            static const Duration instant = Duration(milliseconds: 100);
            static const Duration fast = Duration(milliseconds: 180);
            static const Duration normal = Duration(milliseconds: 280);
            static const Duration slow = Duration(milliseconds: 400);
            static const Duration cardFlip = Duration(milliseconds: 320);

            static const double elevationIdle = 1.0;
            static const double elevationHovered = 4.0;
            static const double elevationPressed = 0.5;
            static const double card3dPerspective = 0.0015;
          }
          DART

          # 3. CardSurfaceContract (431, 432, 433, 434)
          cat << 'DART' > lib/core/ui/contracts/card_surface_contract.dart
          /// عقد صريح لتفاعل البطاقات ثلاثية الأبعاد بدون فوضى في الواجهات
          enum CardFlipSide { front, back }

          abstract class CardSurfaceContract {
            String get cardId;
            CardFlipSide get currentSide;
            bool get isInteractable;
            void onCardFlipped(CardFlipSide newSide);
            void onDragThresholdExceeded(double deltaX);
          }
          DART

          # 4. ColorTokenContract (448, 449, 450)
          cat << 'DART' > lib/core/ui/tokens/app_colors_contract.dart
          /// عقد الألوان المجرد لتسهيل دعم الثيمات والتباين العالي
          class SemanticColorTokens {
            final int primaryRgba;
            final int surfaceBackgroundRgba;
            final int textHighEmphasisRgba;
            final int textMediumEmphasisRgba;
            final int successRgba;
            final int failureRgba;

            const SemanticColorTokens({
              required this.primaryRgba,
              required this.surfaceBackgroundRgba,
              required this.textHighEmphasisRgba,
              required this.textMediumEmphasisRgba,
              required this.successRgba,
              required this.failureRgba,
            });
          }
          DART

          dart analyze \
            lib/core/ui/tokens/app_spacing.dart \
            lib/core/ui/tokens/app_motion.dart \
            lib/core/ui/contracts/card_surface_contract.dart \
            lib/core/ui/tokens/app_colors_contract.dart

      - name: "Commit and Push"
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/
          git commit -m "feat(megabatch-3): UI contracts, design tokens & 3d card foundation" || exit 0
          git push
