name: "Megabatch Runner"

on:
  workflow_dispatch:
    inputs:
      batch_number:
        description: "رقم الحزمة"
        required: true
        default: "4"

permissions:
  contents: write

jobs:
  run-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: "Apply Megabatch 4 - SRS, Behavioral Psychology and Linguistics"
        run: |
          mkdir -p lib/core/srs lib/core/linguistics

          # 1. LeitnerState & SRS Engine (602, 603, 604, 605)
          cat << 'DART' > lib/core/srs/leitner_box_state.dart
          /// نموذج صناديق لايتنر وحساب فترات النسيان رياضياً
          enum LeitnerBox { box1, box2, box3, box4, box5 }

          class LeitnerCardState {
            final String cardId;
            final LeitnerBox currentBox;
            final int lastReviewedEpoch;
            final int nextReviewEpoch;
            final double easeFactor;
            final int consecutiveSuccesses;

            const LeitnerCardState({
              required this.cardId,
              required this.currentBox,
              required this.lastReviewedEpoch,
              required this.nextReviewEpoch,
              this.easeFactor = 2.5,
              this.consecutiveSuccesses = 0,
            });

            bool get isDueForReview =>
                DateTime.now().millisecondsSinceEpoch >= nextReviewEpoch;
          }
          DART

          # 2. SpacedRepetitionEngine (610, 611, 612, 613)
          cat << 'DART' > lib/core/srs/spaced_repetition_engine.dart
          import 'dart0_stub.dart' if (dart.library.core) 'leitner_box_state.dart';

          /// محرك حساب فترات التكرار المتباعد بدون استهلاك معالج الهاتف
          class SpacedRepetitionEngine {
            static const int _oneDayMs = 86400000;

            static LeitnerCardState calculateNextInterval({
              required LeitnerCardState previousState,
              required int rating, // 1: Hard/Fail, 2: Good, 3: Easy
            }) {
              final now = DateTime.now().millisecondsSinceEpoch;

              if (rating <= 1) {
                return LeitnerCardState(
                  cardId: previousState.cardId,
                  currentBox: LeitnerBox.box1,
                  lastReviewedEpoch: now,
                  nextReviewEpoch: now + (1 * _oneDayMs),
                  easeFactor: (previousState.easeFactor - 0.2).clamp(1.3, 3.0),
                  consecutiveSuccesses: 0,
                );
              }

              final newSuccesses = previousState.consecutiveSuccesses + 1;
              final nextBoxIndex = (previousState.currentBox.index + 1).clamp(0, LeitnerBox.values.length - 1);
              final intervalDays = [1, 3, 7, 14, 30][nextBoxIndex];

              return LeitnerCardState(
                cardId: previousState.cardId,
                currentBox: LeitnerBox.values[nextBoxIndex],
                lastReviewedEpoch: now,
                nextReviewEpoch: now + (intervalDays * _oneDayMs),
                easeFactor: (previousState.easeFactor + (rating == 3 ? 0.15 : 0.0)).clamp(1.3, 3.0),
                consecutiveSuccesses: newSuccesses,
              );
            }
          }
          DART

          # 3. PhoneticToken (641, 642, 643)
          cat << 'DART' > lib/core/linguistics/phonetic_token.dart
          /// تمثيل صوتي رمزي دقيق صالح لجميع اللغات (IPA)
          class PhoneticToken {
            final String rawText;
            final String ipaRepresentation;
            final String audioAssetKey;
            final double pitchMultiplier;

            const PhoneticToken({
              required this.rawText,
              required this.ipaRepresentation,
              required this.audioAssetKey,
              this.pitchMultiplier = 1.0,
            });
          }
          DART

          # 4. GrammaticalRoleContract (670, 671, 672)
          cat << 'DART' > lib/core/linguistics/grammatical_role.dart
          /// عقود تصنيف القواعد النحوية الشاملة للغات المختلفة
          enum UniversalGrammaticalCategory {
            noun,
            verb,
            adjective,
            adverb,
            preposition,
            pronoun,
            conjunction,
            particle,
          }

          class GrammarContract {
            final String wordId;
            final UniversalGrammaticalCategory category;
            final Map<String, String> morphologicalFeatures;

            const GrammarContract({
              required this.wordId,
              required this.category,
              this.morphologicalFeatures = const {},
            });
          }
          DART

          dart analyze \
            lib/core/srs/leitner_box_state.dart \
            lib/core/srs/spaced_repetition_engine.dart \
            lib/core/linguistics/phonetic_token.dart \
            lib/core/linguistics/grammatical_role.dart

      - name: "Commit and Push"
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/
          git commit -m "feat(megabatch-4): spaced repetition algorithms and universal linguistics engine" || exit 0
          git push
