name: Content Expansion Bot

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Number of review-only candidate items to generate
        required: false
        default: '4'

permissions:
  contents: write
  pull-requests: write
  actions: none
  checks: none
  id-token: none

concurrency:
  group: content-expansion-bot
  cancel-in-progress: false

jobs:
  expand-content:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      vars.GITHUB_ACTIONS_NONESSENTIAL_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Stop when a bot review PR is already open
        id: open-pr
        shell: bash
        run: |
          set -Eeuo pipefail
          existing="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --json headRefName \
            --jq '.[] | select(.headRefName | startswith("automation/content-bot-")) | .headRefName' \
            | head -n 1)"
          if [[ -n "$existing" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Existing content-bot PR branch: $existing"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.open-pr.outputs.skip != 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Read Flutter toolchain
        if: steps.open-pr.outputs.skip != 'true'
        id: toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          source toolchain.lock
          printf 'flutter=%s\n' "$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        if: steps.open-pr.outputs.skip != 'true'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "${{ steps.toolchain.outputs.flutter }}"
          channel: stable
          cache: false
          pub-cache: false

      - name: Generate review-only candidate
        if: steps.open-pr.outputs.skip != 'true'
        id: generate
        shell: bash
        env:
          REQUESTED_LIMIT: ${{ inputs.limit || '4' }}
        run: |
          set -Eeuo pipefail
          RUN_KEY="$(date -u +%G-W%V)-${GITHUB_RUN_ID}"
          BATCH="content/german/batches/auto/auto-${RUN_KEY}.json"
          PACK="$RUNNER_TEMP/content-expansion-pack.json"
          MANIFEST="$RUNNER_TEMP/content-expansion-manifest.json"
          REPORT="$RUNNER_TEMP/content-expansion-report.json"
          SUMMARY="$RUNNER_TEMP/content-expansion-summary.md"

          python3 scripts/auto_expand_content.py \
            --run-key "$RUN_KEY" \
            --limit "$REQUESTED_LIMIT" \
            --output "$BATCH" \
            --pipeline-pack "$PACK" \
            --pipeline-manifest "$MANIFEST" \
            --report-json "$REPORT" \
            --summary "$SUMMARY"

          python3 - "$REPORT" "$GITHUB_OUTPUT" <<'PY'
          import json
          from pathlib import Path
          import sys

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          with Path(sys.argv[2]).open("a", encoding="utf-8") as out:
              out.write(f"created={'true' if report['created'] else 'false'}\n")
              out.write(f"run_key={report['runKey']}\n")
              out.write(f"batch={report['output']}\n")
              out.write(f"pack={report['pipelinePack']}\n")
              out.write(f"manifest={report['pipelineManifest']}\n")
              out.write(f"report={sys.argv[1]}\n")
              out.write(f"summary={Path(sys.argv[1]).with_name('content-expansion-summary.md')}\n")
          PY

      - name: Resolve locked dependencies
        if: steps.open-pr.outputs.skip != 'true' && steps.generate.outputs.created == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          cp pubspec.lock "$RUNNER_TEMP/pubspec.lock.before"
          flutter pub get --enforce-lockfile
          cmp --silent pubspec.lock "$RUNNER_TEMP/pubspec.lock.before"

      - name: Validate review batch contract
        if: steps.open-pr.outputs.skip != 'true' && steps.generate.outputs.created == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tool/content_authoring.py prepare \
            --source "${{ steps.generate.outputs.batch }}" \
            --output "$RUNNER_TEMP/content-review-batch.json"
          python3 tool/content_ingestion.py prepare-batch \
            --source "$RUNNER_TEMP/content-review-batch.json" \
            --output "$RUNNER_TEMP/content-prepared-batch.json"
          python3 tool/content_quality_gate.py review \
            --source "$RUNNER_TEMP/content-prepared-batch.json" \
            --content content/content_items.json \
            --report "$RUNNER_TEMP/content-quality-report.json"

      - name: Run canonical content pipeline in quarantine mode
        if: steps.open-pr.outputs.skip != 'true' && steps.generate.outputs.created == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          dart run tool/run_agents.dart \
            --content-pipeline "${{ steps.generate.outputs.manifest }}" \
            | tee "$RUNNER_TEMP/content-pipeline-audit.jsonl"
          python3 - "$RUNNER_TEMP/content-pipeline-audit.jsonl" "${{ steps.generate.outputs.report }}" <<'PY'
          import json
          from pathlib import Path
          import sys

          lines = [line for line in Path(sys.argv[1]).read_text(encoding="utf-8").splitlines() if line.strip()]
          if not lines:
              raise SystemExit("content pipeline produced no audit record")
          audit = json.loads(lines[-1])
          report = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          if audit.get("ok") is not True:
              raise SystemExit("content pipeline did not pass")
          packs = audit.get("packs") or []
          canonical = sum(int(pack.get("canonicalCards", 0)) for pack in packs)
          quarantined = sum(int(pack.get("quarantinedCards", 0)) for pack in packs)
          if canonical != 0:
              raise SystemExit(f"review-only candidate escaped quarantine: canonical={canonical}")
          if quarantined != int(report["selectedCount"]):
              raise SystemExit(
                  f"quarantine count mismatch: expected={report['selectedCount']} actual={quarantined}"
              )
          print(f"content_pipeline=PASS canonical={canonical} quarantined={quarantined}")
          PY

      - name: Verify candidate merge parity without mutating canonical content
        if: steps.open-pr.outputs.skip != 'true' && steps.generate.outputs.created == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          cp content/content_items.json "$RUNNER_TEMP/content_items.json"
          cp content/verb_conjugations.json "$RUNNER_TEMP/verb_conjugations.json"
          cp content/german/audio_manifest.json "$RUNNER_TEMP/audio_manifest.json"
          python3 - \
            "$RUNNER_TEMP/content-prepared-batch.json" \
            "$RUNNER_TEMP/content_items.json" \
            "$RUNNER_TEMP/verb_conjugations.json" \
            "$RUNNER_TEMP/candidate-generated" \
            "$RUNNER_TEMP/audio_manifest.json" <<'PY'
          from pathlib import Path
          import sys

          root = Path.cwd()
          sys.path.insert(0, str(root / "tool"))
          from content_ingestion import apply_batch

          content_rows, verb_rows, audio_rows = apply_batch(
              Path(sys.argv[1]),
              Path(sys.argv[2]),
              Path(sys.argv[3]),
              Path(sys.argv[4]),
              Path(sys.argv[5]),
          )
          print(
              "candidate_merge_parity=PASS "
              f"content_rows={content_rows} verb_rows={verb_rows} audio_rows={audio_rows}"
          )
          PY

          git diff --exit-code -- content/content_items.json content/verb_conjugations.json content/german/audio_manifest.json lib/data/generated

      - name: Verify Dart analyzer blockers
        if: steps.open-pr.outputs.skip != 'true' && steps.generate.outputs.created == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          ANALYZER_OUTPUT="$(dart analyze lib/ 2>&1)"
          ANALYZER_STATUS=$?
          set -e
          printf '%s\n' "$ANALYZER_OUTPUT"
          ANALYZER_ERRORS="$(printf '%s\n' "$ANALYZER_OUTPUT" | grep "error •" || true)"
          if [[ -n "$ANALYZER_ERRORS" ]]; then
            printf '%s\n' "$ANALYZER_ERRORS" >&2
            exit 1
          fi
          if [[ "$ANALYZER_STATUS" -eq 127 ]]; then
            exit 1
          fi
          echo "dart_analyzer=PASS blocking_errors=0"

      - name: Create review pull request
        if: steps.open-pr.outputs.skip != 'true' && steps.generate.outputs.created == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          RUN_KEY="${{ steps.generate.outputs.run_key }}"
          BRANCH="automation/content-bot-${RUN_KEY}"
          BATCH="${{ steps.generate.outputs.batch }}"
          SUMMARY="${{ steps.generate.outputs.summary }}"

          cat >> "$SUMMARY" <<EOF

          ### Automated verification

          - V360 authoring conversion: PASS
          - V359 review-batch validation: PASS
          - Content quality gate: PASS
          - Phase-17/18 pipeline: PASS; all generated cards remained quarantined pending human review
          - Candidate merge/compiler parity on temporary copies: PASS
          - Dart analyzer: 0 blocking `error •` entries in `lib/`
          - Base main SHA: `${GITHUB_SHA}`
          EOF

          git config user.name "deutsch-content-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add "$BATCH"
          git diff --cached --quiet && exit 0
          git commit -m "[skip ci] content: add automated review batch ${RUN_KEY}"
          gh auth setup-git
          git push --set-upstream origin "$BRANCH"

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "content: review automated expansion ${RUN_KEY}" \
            --body-file "$SUMMARY"
