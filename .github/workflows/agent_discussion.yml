name: Autonomous Agent Discussion

on:
  issues:
    types: [opened]

jobs:
  discuss:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Agent Dialogue Bridge
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          TRIGGER_TYPE: "issue_opened"
        run: |
          python3 scripts/agent_bridge.py

      - name: Post Agents Response to Issue
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body-path: 'agent_reply.md'
