name: Elastic Worker Factory — Dispatch Validation

on:
  workflow_dispatch:
    inputs:
      dispatch_json:
        description: Versioned Issue #80 dispatch envelope JSON
        required: true
        type: string
      seen_dispatch_ids_json:
        description: Central/durable replay snapshot as a JSON array
        required: false
        default: '[]'
        type: string
  workflow_call:
    inputs:
      dispatch_json:
        description: Versioned Issue #80 dispatch envelope JSON
        required: true
        type: string
      seen_dispatch_ids_json:
        description: Central/durable replay snapshot as a JSON array
        required: false
        default: '[]'
        type: string

permissions:
  contents: read
  actions: none
  checks: none
  id-token: none
  pull-requests: none

concurrency:
  group: elastic-worker-factory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-dispatch:
    name: Validate fail-closed dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Materialize caller-owned dispatch evidence
        env:
          EWF_DISPATCH_JSON: ${{ inputs.dispatch_json }}
          EWF_SEEN_DISPATCH_IDS_JSON: ${{ inputs.seen_dispatch_ids_json }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          runner_temp = Path(os.environ['RUNNER_TEMP'])
          dispatch = json.loads(os.environ['EWF_DISPATCH_JSON'])
          seen = json.loads(os.environ['EWF_SEEN_DISPATCH_IDS_JSON'])
          if not isinstance(dispatch, dict):
              raise SystemExit('dispatch_json must decode to an object')
          if not isinstance(seen, list) or not all(isinstance(item, str) for item in seen):
              raise SystemExit('seen_dispatch_ids_json must decode to an array of strings')
          (runner_temp / 'ewf-dispatch.json').write_text(
              json.dumps(dispatch, sort_keys=True) + '\n', encoding='utf-8'
          )
          (runner_temp / 'ewf-seen.json').write_text(
              json.dumps(seen, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

      - name: Validate exact-base dispatch and replay guard
        run: |
          python tool/elastic_worker_factory.py validate-dispatch \
            --input "$RUNNER_TEMP/ewf-dispatch.json" \
            --expected-base "${{ github.sha }}" \
            --seen-dispatches "$RUNNER_TEMP/ewf-seen.json" \
            --mark-seen
