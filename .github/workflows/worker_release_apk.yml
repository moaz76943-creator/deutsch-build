name: Worker Signed Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: worker-signed-release-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build-release:
    if: github.event.repository.private == true && github.repository == 'sali97m-cpu/deutsch-bilarabi-worker' && github.ref_name == 'main' && vars.BUILD_WORKER_ENABLED == 'true'
    # Default hosted compute; later set JSON labels ["self-hosted","linux","android-build"].
    runs-on: ${{ fromJSON(vars.BUILD_WORKER_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read locked toolchain
        id: toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          source toolchain.lock
          printf 'flutter=%s\n' "$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"
          printf 'java=%s\n' "$JAVA_MAJOR" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "${{ steps.toolchain.outputs.java }}"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "${{ steps.toolchain.outputs.flutter }}"
          channel: stable
          cache: true
          pub-cache: true

      - name: Preserve Gradle caches
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v4
        with:
          cache-disabled: ${{ vars.BUILD_WORKER_RUNNER_LABELS != '' }}

      - name: Set up Python for the existing content gate
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install lightweight gate dependencies
        run: python3 -m pip install pytest==8.3.5

      - name: Ensure locked Android SDK tools
        shell: bash
        run: |
          set -Eeuo pipefail
          source toolchain.lock
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK must be installed on this runner}}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          SDKMANAGER="${SDKMANAGER:-$SDK/cmdline-tools/latest/bin/sdkmanager}"
          "$SDKMANAGER" "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" "ndk;${ANDROID_NDK_VERSION}" platform-tools
          printf 'ANDROID_SDK_ROOT=%s\nANDROID_HOME=%s\n' "$SDK" "$SDK" >> "$GITHUB_ENV"
          printf '%s\n' "$SDK/build-tools/$ANDROID_BUILD_TOOLS_VERSION" >> "$GITHUB_PATH"

      - name: Materialize verified Gradle wrapper
        run: python3 tool/gradle_wrapper_bootstrap.py

      - name: Validate build environment
        run: bash scripts/build_guard.sh

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Zero-error Dart pre-check
        run: bash scripts/check-dart-errors.sh

      - name: Verify content ingestion engine
        run: python -m pytest -q tests/quality_gate/test_content_ingestion_engine.py

      - name: Configure release signing
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          ORG_GRADLE_PROJECT_releaseStoreFile: ${{ runner.temp }}/deutsch-release.jks
          ORG_GRADLE_PROJECT_releaseStorePassword: ${{ secrets.RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_releaseKeyAlias: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_releaseKeyPassword: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set +x
          set -Eeuo pipefail
          : "${RELEASE_KEYSTORE_BASE64:?Missing RELEASE_KEYSTORE_BASE64}"
          umask 077
          ROOT="$GITHUB_WORKSPACE"
          source scripts/release-signing.sh
          prepare_release_signing --ephemeral
          printf 'ORG_GRADLE_PROJECT_releaseStoreFile=%s\n' "$ORG_GRADLE_PROJECT_releaseStoreFile" >> "$GITHUB_ENV"

      - name: Build signed ARM64 release APK
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
          ORG_GRADLE_PROJECT_releaseStorePassword: ${{ secrets.RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_releaseKeyAlias: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_releaseKeyPassword: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set +x
          set -Eeuo pipefail
          bash scripts/signing_guard.sh --ephemeral
          flutter build apk --release \
            --target-platform android-arm64 \
            --obfuscate \
            --split-debug-info=build/symbols

      - name: Verify release artifact
        id: artifact
        shell: bash
        env:
          ORG_GRADLE_PROJECT_releaseStorePassword: ${{ secrets.RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_releaseKeyAlias: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_releaseKeyPassword: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set +x
          set -Eeuo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          bash scripts/apk_verify.sh "$APK" release --ephemeral
          (cd build/app/outputs/flutter-apk && sha256sum app-release.apk > SHA256SUMS.txt && sha256sum --check SHA256SUMS.txt)
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          printf 'sha256=%s\n' "$SHA256" >> "$GITHUB_OUTPUT"
          printf 'APK: %s\nSHA256: %s\n' "$APK" "$SHA256"

      - name: Upload short-lived workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deutsch-bilarabi-release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
            build/symbols/
          if-no-files-found: error
          retention-days: 1

      - name: Publish stable worker release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_SHA256: ${{ steps.artifact.outputs.sha256 }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release delete worker-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create worker-latest \
            build/app/outputs/flutter-apk/app-release.apk#app-release.apk \
            build/app/outputs/flutter-apk/SHA256SUMS.txt#SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Worker signed APK — ${GITHUB_SHA::12}" \
            --notes "Signed ARM64 APK. SHA256: $APK_SHA256"

      - name: Publish download summary
        env:
          APK_SHA256: ${{ steps.artifact.outputs.sha256 }}
        shell: bash
        run: |
          {
            echo '### ✅ Signed APK ready'
            echo
            echo "- Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/worker-latest"
            echo "- Direct asset: https://github.com/${GITHUB_REPOSITORY}/releases/download/worker-latest/app-release.apk"
            echo "- SHA256: ${APK_SHA256}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Telegram on success
        if: success()
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/worker-latest/app-release.apk
        run: |
          set -Eeuo pipefail
          curl --silent --fail --output /dev/null \
            --connect-timeout 10 --max-time 30 \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=✅ APK ready - SHA: $GITHUB_SHA
          $RELEASE_URL" || echo '::warning::Telegram success notification failed.'

      - name: Notify Telegram on failure
        if: failure()
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          curl --silent --fail --output /dev/null \
            --connect-timeout 10 --max-time 30 \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=❌ Build Failed - SHA: $GITHUB_SHA
          $RUN_URL" || echo '::warning::Telegram failure notification failed.'

      - name: Remove this job's temporary signing material
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          (Path(os.environ['RUNNER_TEMP']) / 'deutsch-release.jks').unlink(missing_ok=True)
          PY
