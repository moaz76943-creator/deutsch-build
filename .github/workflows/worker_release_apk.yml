name: Worker Signed Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: worker-signed-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-release:
    if: github.repository == 'sali97m-cpu/deutsch-bilarabi-worker' && vars.BUILD_WORKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Read locked toolchain
        id: toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          source toolchain.lock
          printf 'flutter=%s\n' "$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"
          printf 'java=%s\n' "$JAVA_MAJOR" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "${{ steps.toolchain.outputs.java }}"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "${{ steps.toolchain.outputs.flutter }}"
          channel: stable
          cache: true
          pub-cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Zero-error Dart pre-check
        shell: bash
        run: |
          set -Eeuo pipefail
          status=0
          output="$(dart analyze lib/ 2>&1)" || status=$?
          printf '%s\n' "$output"
          if grep -Fq "error •" <<<"$output"; then
            echo "::error::Blocking Dart analyzer errors found under lib/."
            grep -F "error •" <<<"$output" || true
            exit 1
          fi
          case "$status" in
            0|2) ;;
            *) echo "::error::dart analyze failed with unexpected exit code $status"; exit "$status" ;;
          esac

      - name: Verify content ingestion engine
        run: python -m pytest -q tests/quality_gate/test_content_ingestion_engine.py

      - name: Configure release signing
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          : "${RELEASE_KEYSTORE_BASE64:?Missing RELEASE_KEYSTORE_BASE64}"
          : "${RELEASE_STORE_PASSWORD:?Missing RELEASE_STORE_PASSWORD}"
          : "${RELEASE_KEY_ALIAS:?Missing RELEASE_KEY_ALIAS}"
          : "${RELEASE_KEY_PASSWORD:?Missing RELEASE_KEY_PASSWORD}"

          KEYSTORE="$RUNNER_TEMP/deutsch-release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"

          mkdir -p "$HOME/.gradle"
          {
            printf 'releaseStoreFile=%s\n' "$KEYSTORE"
            printf 'releaseStorePassword=%s\n' "$RELEASE_STORE_PASSWORD"
            printf 'releaseKeyAlias=%s\n' "$RELEASE_KEY_ALIAS"
            printf 'releaseKeyPassword=%s\n' "$RELEASE_KEY_PASSWORD"
          } >> "$HOME/.gradle/gradle.properties"
          chmod 600 "$HOME/.gradle/gradle.properties"

      - name: Build signed ARM64 release APK
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --obfuscate \
            --split-debug-info=build/symbols

      - name: Verify release artifact
        id: artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          printf 'sha256=%s\n' "$SHA256" >> "$GITHUB_OUTPUT"
          printf 'APK: %s\nSHA256: %s\n' "$APK" "$SHA256"

      - name: Upload short-lived workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deutsch-bilarabi-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1

      - name: Publish stable worker release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_SHA256: ${{ steps.artifact.outputs.sha256 }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh release delete worker-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create worker-latest \
            build/app/outputs/flutter-apk/app-release.apk#app-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Worker signed APK — ${GITHUB_SHA::12}" \
            --notes "Signed ARM64 APK. SHA256: $APK_SHA256"

      - name: Publish download summary
        env:
          APK_SHA256: ${{ steps.artifact.outputs.sha256 }}
        shell: bash
        run: |
          {
            echo '### ✅ Signed APK ready'
            echo
            echo "- Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/worker-latest"
            echo "- Direct asset: https://github.com/${GITHUB_REPOSITORY}/releases/download/worker-latest/app-release.apk"
            echo "- SHA256: ${APK_SHA256}"
          } >> "$GITHUB_STEP_SUMMARY"
