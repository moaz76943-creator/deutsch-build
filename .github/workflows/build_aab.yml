name: Android Production Build (APK & AAB)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-lock:
    name: Resolve and verify SQLite-v2 dependencies
    if: github.ref == 'refs/heads/fix/flutter-ci-sdk-alignment-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write

    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify Gradle wrapper integrity
        run: python3 tool/gradle_wrapper_integrity.py

      - name: Read locked Flutter version
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          source toolchain.lock
          echo "flutter=$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"
          echo "java=$JAVA_MAJOR" >> "$GITHUB_OUTPUT"

      - name: Set up locked Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java }}

      - name: Install pinned Flutter toolchain
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.toolchain.outputs.flutter }}
          cache: true
          pub-cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Assert native SQLite v2 contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          lock = Path("pubspec.lock").read_text(encoding="utf-8")
          def version(name):
              match = re.search(
                  rf"(?ms)^  {re.escape(name)}:\n(.*?)(?=^  [\w]+:\n|^sdks:|\Z)",
                  lock,
              )
              if match is None:
                  raise SystemExit(f"Missing locked package: {name}")
              value = re.search(r'^    version: "([^"]+)"$', match.group(1), re.M)
              if value is None:
                  raise SystemExit(f"Missing locked version: {name}")
              return value.group(1)

          sqlite = version("sqlite3")
          ffi = version("sqflite_common_ffi")
          native = version("sqlite3_flutter_libs")
          def semver(raw):
              match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)(?:\+\d+)?", raw)
              if match is None:
                  raise SystemExit(f"Unexpected package version: {raw}")
              return tuple(int(part) for part in match.groups())

          if not ( (2, 9, 4) <= semver(sqlite) < (3, 0, 0) ):
              raise SystemExit(f"Expected SQLite >=2.9.4 <3.0.0, got {sqlite}")
          if not ( (2, 3, 7) <= semver(ffi) < (2, 4, 0) ):
              raise SystemExit(f"Expected FFI >=2.3.7 <2.4.0, got {ffi}")
          if native != "0.5.42":
              raise SystemExit(f"Expected native SQLite 0.5.42, got {native}")
          print(f"Verified SQLite v2: sqlite3={sqlite}, ffi={ffi}, libs={native}")
          PY
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.yaml toolchain.lock

      - name: Check Dart blocking diagnostics
        run: bash scripts/check-dart-errors.sh

      - name: Run Flutter tests
        run: flutter test

      - name: Compile debug APK to verify Android and plugin compatibility
        run: flutter build apk --debug

      - name: Verify compiled debug APK exists
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-debug.apk

      - name: Verify the previously failing TTS release metadata task
        shell: bash
        run: |
          set -euo pipefail
          cd android
          sh ./gradlew :flutter_tts:checkReleaseAarMetadata --no-daemon

      - name: Upload tested debug APK
        uses: actions/upload-artifact@v4
        with:
          name: deutsch-debug-smoke-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 1
          if-no-files-found: error

      - name: Preserve verified dependency lock for recovery
        uses: actions/upload-artifact@v4
        with:
          name: verified-sqlite2-lock-${{ github.sha }}
          path: pubspec.lock
          retention-days: 2
          if-no-files-found: error

      - name: Commit verified lockfile after all checks pass
        shell: bash
        run: |
          set -euo pipefail
          # Only pubspec.lock may be published by this repair operation.
          unexpected="$(git diff --name-only -- . ':!pubspec.lock')"
          test -z "$unexpected" || { printf 'Unexpected tracked changes:\n%s\n' "$unexpected" >&2; exit 1; }
          git add -- pubspec.lock
          if git diff --cached --quiet; then
            echo "Dependency lockfile is already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fix(deps): regenerate verified SQLite v2 lockfile [skip ci]"
            git push origin "HEAD:${GITHUB_REF}"
          fi

  build:
    name: Build & Release Android
    if: github.ref != 'refs/heads/fix/flutter-ci-sdk-alignment-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 مسحب الكود البرمجي (Checkout)
        uses: actions/checkout@v4

      - name: Verify pinned Gradle wrapper before downloading SDKs
        run: python3 tool/gradle_wrapper_integrity.py

      - name: Fail fast when signing secrets are missing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for required in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            test -n "${!required:-}" || { echo "::error::Missing $required signing secret"; exit 1; }
          done

      - name: ⚙️ إعداد بيئة جافا (Java 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Read pinned Flutter version
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          source toolchain.lock
          printf 'flutter=%s\n' "$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"

      - name: 🐦 إعداد بيئة فلاتر (Flutter)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ steps.toolchain.outputs.flutter }}
          cache: true
          pub-cache: true

      - name: 📦 جلب الحزم والمكاتب (Pub Get)
        run: flutter pub get --enforce-lockfile

      - name: Load release keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.jks
          chmod 600 android/app/upload-keystore.jks
          keytool -list -keystore android/app/upload-keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null

      - name: 🛠️ بناء التطبيق للهاتف (Build APK)
        env:
          ORG_GRADLE_PROJECT_releaseStoreFile: upload-keystore.jks
          ORG_GRADLE_PROJECT_releaseStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_releaseKeyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_releaseKeyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: 🛠️ بناء التطبيق للمتجر (Build AAB)
        env:
          ORG_GRADLE_PROJECT_releaseStoreFile: upload-keystore.jks
          ORG_GRADLE_PROJECT_releaseStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_releaseKeyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_releaseKeyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Verify signed artifacts
        shell: bash
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          aab="build/app/outputs/bundle/release/app-release.aab"
          test -s "$apk" && test -s "$aab"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root" && test -d "$sdk_root/build-tools"
          signer="$(find "$sdk_root/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$signer"
          "$signer" verify --verbose "$apk"
          verification="$(jarsigner -verify -certs "$aab" 2>&1)"
          printf '%s\n' "$verification"
          if ! grep -Fq 'jar verified.' <<< "$verification"; then
            echo "::error::AAB is unsigned or failed JAR signature validation"
            exit 1
          fi
          sha256sum "$apk" "$aab"

      - name: 📤 استخراج وحفظ نسخة الهاتف (Upload APK)
        uses: actions/upload-artifact@v4
        with:
          name: Deutsch-BiLarabi-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
          if-no-files-found: error

      - name: 📤 استخراج وحفظ نسخة المتجر (Upload AAB)
        uses: actions/upload-artifact@v4
        with:
          name: Deutsch-BiLarabi-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7
          if-no-files-found: error

      - name: Clean up signing material
        if: always()
        shell: bash
        run: rm -f android/app/upload-keystore.jks
