      - name: Ensure Android SDK packages
        shell: bash
        env:
          ANDROID_COMPILE_SDK: "${{ steps.toolchain.outputs.android_compile_sdk }}"
          ANDROID_BUILD_TOOLS: "${{ steps.toolchain.outputs.android_build_tools }}"
          ANDROID_NDK: "${{ steps.toolchain.outputs.android_ndk }}"
        run: |
          set -Eeuo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}"

      - name: Materialize verified Gradle wrapper
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tool/gradle_wrapper_bootstrap.py
          python3 tool/gradle_wrapper_integrity.py

      - name: Fetch locked Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Materialize generated runtime content
        run: python3 tool/content_compiler.py compile --output-dir lib/data/generated

      - name: Validate signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required release-signing secret is missing: ${name}"
              exit 1
            fi
          done

      - name: Materialize private upload keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -Eeuo pipefail
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          test -s android/app/upload-keystore.jks
          chmod 600 android/app/upload-keystore.jks

      - name: Verify release signing contract
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -F 'secureRelease' android/app/build.gradle >/dev/null
          grep -F 'signingConfig signingConfigs.secureRelease' android/app/build.gradle >/dev/null
          ! grep -F 'signingConfigs.debug' android/app/build.gradle >/dev/null

      - name: Build signed production AAB
        env:
          ORG_GRADLE_PROJECT_releaseStoreFile: ${{ github.workspace }}/android/app/upload-keystore.jks
          ORG_GRADLE_PROJECT_releaseStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_releaseKeyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_releaseKeyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build appbundle --release --obfuscate --split-debug-info=symbols/ --build-name=3.3.10 --build-number=133

      - name: Verify output and record SHA-256
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail
          AAB="build/app/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          test -d symbols
          find symbols -type f -print -quit | grep -q .

          jarsigner -verify -strict "$AAB" >/dev/null

          mkdir -p release-metadata
          AAB_SHA256="$(sha256sum "$AAB" | awk '{print $1}')"
          AAB_SIZE_BYTES="$(wc -c < "$AAB" | tr -d ' ')"

          printf '%s  %s\n' "$AAB_SHA256" "app-release.aab" \
            | tee release-metadata/SHA256SUMS.txt

          find symbols -type f -print0 \
            | sort -z \
            | xargs -0 -r sha256sum \
            >> release-metadata/SHA256SUMS.txt

          {
            echo "### Signed Android App Bundle"
            echo
            echo "- Version: \`3.3.10+133\`"
            echo "- File: \`app-release.aab\`"
            echo "- Size: \`${AAB_SIZE_BYTES}\` bytes"
            echo "- SHA-256: \`${AAB_SHA256}\`"
            echo "- Signature verification: \`PASS\`"
            echo "- Dart obfuscation: \`enabled\`"
            echo "- Split debug symbols: \`symbols/\`"
          } >> "$GITHUB_STEP_SUMMARY"

          printf 'aab_sha256=%s\n' "$AAB_SHA256" >> "$GITHUB_OUTPUT"
          echo "AAB SHA-256: $AAB_SHA256"

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
