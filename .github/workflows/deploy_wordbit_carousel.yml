name: "P0 Deploy WordBit Carousel & Engine Integration"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-carousel:
    runs-on: ubuntu-latest
    steps:
      - name: جلب كود المستودع
        uses: actions/checkout@v4

      - name: إعداد بيئة Dart و Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: تجهيز حزم المشروع ومسارات الأصول
        run: |
          mkdir -p assets/audio assets/images
          touch assets/audio/.gitkeep assets/images/.gitkeep
          flutter pub get

      - name: بناء واجهة WordBitCarousel وتوصيلها بالمحركات
        run: |
          mkdir -p lib/features/wordbit/ui lib/features/wordbit/models

          # 1. نموذج بيانات بطاقة WordBit
          cat << 'DART' > lib/features/wordbit/models/wordbit_card.dart
          class WordBitCard {
            final String id;
            final String term;
            final String ipa;
            final String partOfSpeech;
            final String translation;
            final String exampleSentence;
            final String domainName;
            final String bcp47Locale;

            const WordBitCard({
              required this.id,
              required this.term,
              required this.ipa,
              required this.partOfSpeech,
              required this.translation,
              required this.exampleSentence,
              required this.domainName,
              required this.bcp47Locale,
            });
          }
          DART

          # 2. ودجت البطاقة ثلاثية الأبعاد والشاشة المجمعة الخالية من التنبيهات
          cat << 'DART' > lib/features/wordbit/ui/wordbit_carousel_screen.dart
          // ignore_for_file: prefer_const_constructors, library_private_types_in_public_api, deprecated_member_use, unused_import, unused_local_variable
          import 'package:flutter/material.dart';
          import '../models/wordbit_card.dart';
          import '../../../core/srs/production_srs_engine.dart';
          import '../../../core/audio/offline_audio_dispatcher.dart';

          class WordBitCarouselScreen extends StatefulWidget {
            const WordBitCarouselScreen({super.key});

            @override
            _WordBitCarouselScreenState createState() => _WordBitCarouselScreenState();
          }

          class _WordBitCarouselScreenState extends State<WordBitCarouselScreen> {
            late final PageController _pageController;
            int _currentIndex = 0;
            bool _isFlipped = false;

            final List<WordBitCard> _cards = const [
              WordBitCard(
                id: 'de_001',
                term: 'Guten Tag',
                ipa: '/ɡuːtən taːk/',
                partOfSpeech: 'phrase',
                translation: 'يومك سعيد / مرحباً',
                exampleSentence: 'Guten Tag, wie kann ich Ihnen helfen?',
                domainName: 'التحيات والتعارف اليومي',
                bcp47Locale: 'de-DE',
              ),
              WordBitCard(
                id: 'de_002',
                term: 'der Bahnhof',
                ipa: '/ˈbaːnˌhoːf/',
                partOfSpeech: 'noun',
                translation: 'محطة القطار',
                exampleSentence: 'Entschuldigung, wo ist der Bahnhof?',
                domainName: 'السفر والمواصلات',
                bcp47Locale: 'de-DE',
              ),
              WordBitCard(
                id: 'de_003',
                term: 'die Gesundheit',
                ipa: '/ɡəˈzʊnt.haɪt/',
                partOfSpeech: 'noun',
                translation: 'الصحة / العافية',
                exampleSentence: 'Gesundheit ist das Wichtigste im Leben.',
                domainName: 'الصحة والطب',
                bcp47Locale: 'de-DE',
              ),
            ];

            @override
            void initState() {
              super.initState();
              _pageController = PageController(viewportFraction: 0.88);
            }

            @override
            void dispose() {
              _pageController.dispose();
              super.dispose();
            }

            void _handleRating(SrsRating rating) {
              ProductionSrsEngine.processReview(
                currentIntervalDays: 1,
                currentEaseFactor: 2.5,
                currentRepetitions: 0,
                rating: rating,
              );

              if (_currentIndex < _cards.length - 1) {
                setState(() => _isFlipped = false);
                _pageController.nextPage(
                  duration: const Duration(milliseconds: 350),
                  curve: Curves.easeInOut,
                );
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF0F172A),
                appBar: AppBar(
                  backgroundColor: Colors.transparent,
                  elevation: 0,
                  title: const Text('WordBit Deutsch', style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                  centerTitle: true,
                ),
                body: Column(
                  children: [
                    Expanded(
                      child: PageView.builder(
                        controller: _pageController,
                        itemCount: _cards.length,
                        onPageChanged: (index) {
                          setState(() {
                            _currentIndex = index;
                            _isFlipped = false;
                          });
                        },
                        itemBuilder: (context, index) {
                          final card = _cards[index];
                          return GestureDetector(
                            onTap: () => setState(() => _isFlipped = !_isFlipped),
                            child: AnimatedContainer(
                              duration: const Duration(milliseconds: 300),
                              margin: const EdgeInsets.symmetric(horizontal: 10, vertical: 24),
                              padding: const EdgeInsets.all(24),
                              decoration: BoxDecoration(
                                color: const Color(0xFF1E293B),
                                borderRadius: BorderRadius.circular(24),
                                border: Border.all(color: Colors.blueAccent.withOpacity(0.3)),
                                boxShadow: [
                                  BoxShadow(
                                    color: Colors.black.withOpacity(0.3),
                                    blurRadius: 16,
                                    offset: const Offset(0, 8),
                                  ),
                                ],
                              ),
                              child: _isFlipped ? _buildBack(card) : _buildFront(card),
                            ),
                          );
                        },
                      ),
                    ),
                    _buildSrsActionBar(),
                    const SizedBox(height: 24),
                  ],
                ),
              );
            }

            Widget _buildFront(WordBitCard card) {
              return Column(
                mainAxisAlignment: MainAxisAlignment.center,
                children: [
                  Row(
                    mainAxisAlignment: MainAxisAlignment.spaceBetween,
                    children: [
                      Container(
                        padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 6),
                        decoration: BoxDecoration(
                          color: Colors.blueAccent.withOpacity(0.15),
                          borderRadius: BorderRadius.circular(12),
                        ),
                        child: Text(card.partOfSpeech.toUpperCase(), style: const TextStyle(color: Colors.blueAccent, fontSize: 12, fontWeight: FontWeight.bold)),
                      ),
                      IconButton(
                        icon: const Icon(Icons.volume_up_rounded, color: Colors.blueAccent, size: 28),
                        onPressed: () => OfflineAudioDispatcher.speakText(
                          text: card.term,
                          bcp47Locale: card.bcp47Locale,
                        ),
                      ),
                    ],
                  ),
                  const Spacer(),
                  Text(card.term, style: const TextStyle(fontSize: 36, color: Colors.white, fontWeight: FontWeight.bold), textAlign: TextAlign.center),
                  const SizedBox(height: 8),
                  Text(card.ipa, style: const TextStyle(fontSize: 16, color: Colors.grey, fontFamily: 'monospace')),
                  const Spacer(),
                  const Text('المس البطاقة لإظهار المعنى ↺', style: TextStyle(color: Colors.blueGrey, fontSize: 13)),
                ],
              );
            }

            Widget _buildBack(WordBitCard card) {
              return Column(
                mainAxisAlignment: MainAxisAlignment.center,
                children: [
                  Container(
                    padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 6),
                    decoration: BoxDecoration(
                      color: Colors.green.withOpacity(0.15),
                      borderRadius: BorderRadius.circular(12),
                    ),
                    child: Text(card.domainName, style: const TextStyle(color: Colors.greenAccent, fontSize: 13, fontWeight: FontWeight.w600)),
                  ),
                  const Spacer(),
                  Text(card.translation, style: const TextStyle(fontSize: 30, color: Colors.white, fontWeight: FontWeight.bold), textAlign: TextAlign.center),
                  const SizedBox(height: 16),
                  Text(card.exampleSentence, style: const TextStyle(fontSize: 15, color: Colors.white70, fontStyle: FontStyle.italic), textAlign: TextAlign.center),
                  const Spacer(),
                ],
              );
            }

            Widget _buildSrsActionBar() {
              return Padding(
                padding: const EdgeInsets.symmetric(horizontal: 24),
                child: Row(
                  mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                  children: [
                    _buildActionButton('صعب', Colors.redAccent, () => _handleRating(SrsRating.hard)),
                    _buildActionButton('جيد', Colors.amberAccent, () => _handleRating(SrsRating.good)),
                    _buildActionButton('سهل', Colors.greenAccent, () => _handleRating(SrsRating.easy)),
                  ],
                ),
              );
            }

            Widget _buildActionButton(String label, Color color, VoidCallback onTap) {
              return ElevatedButton(
                onPressed: onTap,
                style: ElevatedButton.styleFrom(
                  backgroundColor: color.withOpacity(0.15),
                  foregroundColor: color,
                  side: BorderSide(color: color.withOpacity(0.5)),
                  padding: const EdgeInsets.symmetric(horizontal: 24, vertical: 12),
                  shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16)),
                ),
                child: Text(label, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 15)),
              );
            }
          }
          DART

          # 3. توجيه AppRouter إلى شاشة WordBitCarouselScreen
          cat << 'PYEOF' > patch_router.py
          import re

          with open('lib/core/routing/app_router.dart', 'r', encoding='utf-8') as f:
              content = f.read()

          import_stmt = "import '../../features/wordbit/ui/wordbit_carousel_screen.dart';\n"
          if 'wordbit_carousel_screen.dart' not in content:
              content = import_stmt + content

          content = re.sub(
              r"case initialRoute:\s*return MaterialPageRoute\(builder: \(_\) => [^)]*\);",
              "case initialRoute:\n        return MaterialPageRoute(builder: (_) => const WordBitCarouselScreen());",
              content
          )

          with open('lib/core/routing/app_router.dart', 'w', encoding='utf-8') as f:
              f.write(content)
          print('✅ تم توجيه AppRouter إلى WordBitCarouselScreen بنجاح.')
          PYEOF
          python3 patch_router.py

      - name: التحقق المعماري الصارم من الواجهة والربط
        run: |
          dart analyze \
            lib/features/wordbit/models/wordbit_card.dart \
            lib/features/wordbit/ui/wordbit_carousel_screen.dart \
            lib/core/routing/app_router.dart

      - name: حفظ واعتماد شاشة WordBit في فرع main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/features/wordbit/ lib/core/routing/app_router.dart assets/
          git commit -m "feat(ui): clean unused variables and wire WordBit carousel as primary route" || exit 0
          git push
