name: Privacy Policy Health Check

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions: {}

env:
  PRIVACY_POLICY_URL: https://moaz76943-creator.github.io/deutsch-bilarabi-privacy/privacy.html

concurrency:
  group: privacy-policy-health-check
  cancel-in-progress: true

jobs:
  check-url:
    name: Check privacy policy URL
    if: >-
      github.event_name == 'workflow_dispatch' ||
      vars.GITHUB_ACTIONS_NONESSENTIAL_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check Privacy Policy Status
        shell: bash
        run: |
          set -Eeuo pipefail

          if ! status="$(curl \
            --location \
            --silent \
            --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 2 \
            --retry-all-errors \
            "$PRIVACY_POLICY_URL")"; then
            echo "::error::Privacy policy request failed before a valid HTTP response was received."
            exit 1
          fi

          echo "Privacy policy URL status code: $status"

          if [[ "$status" != "200" ]]; then
            echo "::error::Privacy policy page is down or returned status $status."
            exit 1
          fi

          echo "Privacy policy link is healthy."
