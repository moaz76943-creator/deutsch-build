name: Hermes Auto Resume After Quota Reset

on:
  schedule:
    - cron: '15 0,8 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  resume:
    runs-on: ubuntu-latest
    steps:
      - name: فحص وتشغيل السيرفرات إذا كانت متوقفة
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ACTIVE=$(gh run list -R "moaz76943-creator/deutsch-build" -w hermes-relay.yml --json status --jq '[.[] | select(.status=="in_progress" or .status=="queued")] | length')
          if [ "$ACTIVE" -eq 0 ]; then
            echo "السيرفرات متوقفة — إعادة التشغيل الآن..."
            gh workflow run hermes-relay.yml -R "moaz76943-creator/deutsch-build" --ref "main" -f hop=1 -f max_hops="5"
          else
            echo "السيرفرات شغالة حالياً ($ACTIVE) — لا داعي للتدخل."
          fi
