name: Polyglot Unified CI & Security Gate

on:
  push:
    branches: [ main ]
    paths:
      - 'lib/core/polyglot/**'
      - 'lib/core/i18n/**'
      - 'test/core/polyglot/**'
      - 'test/core/i18n/**'
      - 'assets/registry/**'
      - 'assets/languages/**'
      - 'tools/polyglot/**'
      - '.github/workflows/polyglot_ci.yml'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  pull_request:
    branches: [ main ]
    paths:
      - 'lib/core/polyglot/**'
      - 'lib/core/i18n/**'
      - 'test/core/polyglot/**'
      - 'test/core/i18n/**'
      - 'assets/registry/**'
      - 'assets/languages/**'
      - 'tools/polyglot/**'
      - '.github/workflows/polyglot_ci.yml'
      - 'pubspec.yaml'
      - 'pubspec.lock'

permissions:
  contents: read

concurrency:
  group: polyglot-ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    # Bounded, opt-in hosted check: full target verification runs on the private
    # staging self-check; this workflow stays off by default to preserve the
    # zero-additional-billing posture.
    if: ${{ vars.GITHUB_ACTIONS_NONESSENTIAL_AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Unified Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - name: Run Zero-Secrets & Status Audit
        run: |
          python3 tool/polyglot_cli.py status
          python3 tool/polyglot_cli.py security-scan

      - name: Resolve pinned toolchain
        id: toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          source toolchain.lock
          printf 'flutter=%s\n' "$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "${{ steps.toolchain.outputs.flutter }}"
          channel: 'stable'

      - name: Install Dependencies & Analyze
        run: |
          flutter pub get
          flutter analyze lib/polyglot_core.dart

      - name: Run Unified Polyglot Test Suite
        run: flutter test test/core/polyglot/
