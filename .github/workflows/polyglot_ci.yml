name: Polyglot Unified CI & Security Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Unified Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Zero-Secrets & Status Audit
        run: |
          python3 tool/polyglot_cli.py status
          python3 tool/polyglot_cli.py security-scan

      - name: Resolve pinned toolchain
        id: toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          source toolchain.lock
          printf 'flutter=%s\n' "$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "${{ steps.toolchain.outputs.flutter }}"
          channel: 'stable'

      - name: Install Dependencies & Analyze
        run: |
          flutter pub get
          flutter analyze lib/polyglot_core.dart

      - name: Run Unified Polyglot Test Suite
        run: flutter test test/core/polyglot/
