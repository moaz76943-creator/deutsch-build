name: Recovery Checkpoint

on:
  push:
    branches:
      - main
      - staging/v2-full-platform
    paths-ignore:
      - 'docs/project-record/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-recovery-checkpoint
  cancel-in-progress: false

jobs:
  checkpoint:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      vars.GITHUB_ACTIONS_NONESSENTIAL_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create recovery tag
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          timestamp="$(date -u +%Y%m%d-%H%M%S)"
          short_sha="${GITHUB_SHA::12}"
          tag="recovery/${timestamp}-${short_sha}-${GITHUB_RUN_ID}"
          payload="$(printf '{"ref":"refs/tags/%s","sha":"%s"}' "$tag" "$GITHUB_SHA")"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data "${payload}"
          echo "Recovery checkpoint created: ${tag}"
          echo "Commit preserved: ${GITHUB_SHA}"