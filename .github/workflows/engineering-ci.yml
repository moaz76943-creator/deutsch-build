name: Engineering CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/project-record/**'
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: none
  checks: none
  id-token: none
  pull-requests: none

concurrency:
  group: engineering-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-gates:
    name: Python engineering gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test tooling
        run: python -m pip install --upgrade pip pytest

      - name: Run Python regression tests
        run: python -m pytest -q tests

      - name: Run security and quality gates
        run: |
          python tool/quality_audit.py
          python tool/security_audit.py
          python tool/privacy_audit.py
          python tool/accessibility_audit.py
          python tool/architecture_audit.py
          python tool/weakness_gate.py
          python tool/content_pack.py validate
          python tool/content_ingestion.py validate

      - name: Verify canonical content compilation and parity
        run: |
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          python tool/content_compiler.py compile --output-dir "$tmp_dir/generated"
          python tool/content_compiler.py parity --output-dir "$tmp_dir/generated"

  flutter-android:
    name: Flutter Android readiness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Read toolchain.lock
        id: toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          source toolchain.lock
          printf 'flutter=%s\n' "$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "${{ steps.toolchain.outputs.flutter }}"
          channel: stable
          cache: false
          pub-cache: false

      - name: Fetch Flutter dependencies
        run: flutter pub get

      - name: Materialize Flutter runtime content
        run: python3 tool/content_compiler.py compile --output-dir lib/data/generated

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build Android release APK
        run: flutter build apk --release
