name: Engineering CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: engineering-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-gates:
    name: Python engineering gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test tooling
        run: python -m pip install --upgrade pip pytest

      - name: Run Python regression tests
        run: python -m pytest -q tests

      - name: Run security and quality gates
        run: |
          python tool/quality_audit.py
          python tool/security_audit.py
          python tool/privacy_audit.py
          python tool/accessibility_audit.py
          python tool/architecture_audit.py
          python tool/weakness_gate.py
          python tool/content_pack.py validate
          python tool/content_ingestion.py validate

      - name: Verify canonical content compilation and parity
        run: |
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          python tool/content_compiler.py compile --output-dir "$tmp_dir/generated"
          python tool/content_compiler.py parity --output-dir "$tmp_dir/generated"

  flutter-android:
    name: Flutter Android readiness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build Android release APK
        run: flutter build apk --release
