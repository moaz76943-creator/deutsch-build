name: "استخراج ملف التثبيت (APK) لتحميله وتجربته على الهاتف"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: جلب كود المستودع
        uses: actions/checkout@v4

      - name: إعداد بيئة جافا (Java JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: إعداد بيئة Dart و Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: 1. الإصلاح التلقائي للملف الرئيسي (Auto-Fix main.dart)
        run: |
          cat << 'DART' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'features/wordbit/ui/wordbit_carousel_screen.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const MyApp());
          }

          class MyApp extends StatelessWidget {
            const MyApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'Language App',
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF0F172A),
                ),
                // فتح شاشة البطاقات التفاعلية الجديدة مباشرة
                home: const WordBitCarouselScreen(),
              );
            }
          }
          DART

      - name: 2. تنظيف حزم المشروع وتجهيز مسارات الأصول
        run: |
          mkdir -p assets/audio assets/images assets/fonts assets/data
          touch assets/audio/.gitkeep assets/images/.gitkeep assets/fonts/.gitkeep assets/data/.gitkeep
          flutter clean
          flutter pub get

      - name: 3. توليد مفتاح التوقيع وتجميع ملف الـ APK
        run: |
          mkdir -p "$HOME/.gradle" android/app
          
          keytool -genkeypair -v \
            -keystore "$HOME/.gradle/release-key.jks" \
            -alias releaseKey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=DeutschApp, OU=Mobile, O=App, L=Amman, S=Amman, C=JO" -noprompt || true

          cp "$HOME/.gradle/release-key.jks" android/app/release-key.jks || true
          
          cat << 'EOF' > "$HOME/.gradle/gradle.properties"
          releaseKeystoreFile=/home/runner/.gradle/release-key.jks
          releaseKeyAlias=releaseKey
          releaseKeyPassword=android
          releaseKeystorePassword=android
          EOF
          
          echo "🚀 جاري بناء ملف APK التثبيت المباشر..."
          flutter build apk --debug -v > build_output.log 2>&1 || {
            echo "❌ حدث خطأ أثناء البناء:"
            tail -n 100 build_output.log
            exit 1
          }

      - name: 4. رفع ملف التطبيق النهائي للتنزيل المباشر
        uses: actions/upload-artifact@v4
        with:
          name: Deutsch-App-Phone-Install
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
