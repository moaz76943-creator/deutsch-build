name: "استخراج ملف التثبيت (APK) لتحميله وتجربته على الهاتف"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: جلب كود المستودع
        uses: actions/checkout@v4

      - name: إعداد بيئة جافا (Java JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: إعداد بيئة Dart و Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: تجهيز مسارات الأصول وتوافق الدوال
        run: |
          mkdir -p assets/audio assets/images assets/fonts assets/data
          touch assets/audio/.gitkeep assets/images/.gitkeep assets/fonts/.gitkeep assets/data/.gitkeep
          flutter pub get

      - name: توليد مفتاح التوقيع وتجميع ملف الـ APK
        run: |
          # 1. تأمين مجلدات المفاتيح
          mkdir -p "$HOME/.gradle" android/app

          # 2. توليد مفتاح التوقيع الرقمي المطلوب
          keytool -genkeypair -v \
            -keystore "$HOME/.gradle/release-key.jks" \
            -alias releaseKey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=DeutschApp, OU=Mobile, O=App, L=Amman, S=Amman, C=JO" -noprompt || true

          # نسخ المفتاح لكافة المسارات المتوقعة في أندرويد
          cp "$HOME/.gradle/release-key.jks" android/app/release-key.jks || true
          cp "$HOME/.gradle/release-key.jks" android/release-key.jks || true

          # 3. حقن بيانات المفتاح في إعدادات Gradle
          cat << 'EOF' > "$HOME/.gradle/gradle.properties"
          releaseKeystoreFile=/home/runner/.gradle/release-key.jks
          releaseKeyAlias=releaseKey
          releaseKeyPassword=android
          releaseKeystorePassword=android
          EOF

          cat << 'EOF' >> "android/gradle.properties"
          releaseKeystoreFile=/home/runner/.gradle/release-key.jks
          releaseKeyAlias=releaseKey
          releaseKeyPassword=android
          releaseKeystorePassword=android
          EOF

          cat << 'EOF' > "android/key.properties"
          releaseKeystoreFile=/home/runner/.gradle/release-key.jks
          releaseKeyAlias=releaseKey
          releaseKeyPassword=android
          releaseKeystorePassword=android
          storeFile=/home/runner/.gradle/release-key.jks
          keyAlias=releaseKey
          keyPassword=android
          storePassword=android
          EOF

          # 4. تشغيل سكربت المستودع إن وجد
          if [ -f "scripts/local-release.sh" ]; then
            chmod +x scripts/local-release.sh
            bash scripts/local-release.sh || true
          fi

          # 5. التجميع مع التقاط السجل الكامل
          echo "🚀 جاري بناء ملف APK التثبيت المباشر..."
          flutter build apk --debug -v > build_output.log 2>&1 || {
            echo "❌ تفاصيل العطل من داخل أندرويد:"
            tail -n 100 build_output.log
            exit 1
          }

      - name: رفع ملف التطبيق النهائي للتنزيل المباشر
        uses: actions/upload-artifact@v4
        with:
          name: Deutsch-App-Phone-Install
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
