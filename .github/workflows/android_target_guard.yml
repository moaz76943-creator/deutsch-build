name: Android Target SDK Guard

on:
  pull_request:
    branches: [main, staging/v2-full-platform]
    paths:
      - android/app/build.gradle
      - .github/workflows/android_target_guard.yml
  push:
    branches: [main, staging/v2-full-platform]
    paths:
      - android/app/build.gradle
      - .github/workflows/android_target_guard.yml
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: android-target-sdk-guard-${{ github.ref }}
  cancel-in-progress: true

env:
  # Google Play requirement effective 2026-08-31 for phone/tablet apps.
  GOOGLE_PLAY_MIN_TARGET_SDK: "36"
  GOOGLE_PLAY_MIN_COMPILE_SDK: "36"
  GOOGLE_PLAY_POLICY_MONTH_DAY: "08-31"
  GOOGLE_PLAY_POLICY_WARNING_DAYS: "90"
  GOOGLE_PLAY_POLICY_SOURCE: "https://support.google.com/googleplay/android-developer/answer/11926878"

jobs:
  android-sdk-guard:
    name: Enforce Google Play Android SDK floor
    if: >-
      github.event_name == 'workflow_dispatch' ||
      vars.GITHUB_ACTIONS_NONESSENTIAL_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Open annual policy review issue when deadline approaches
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          export TODAY_UTC="$(date -u +%F)"
          read -r NEXT_DEADLINE DAYS_LEFT < <(
            python3 <<'PY'
          from datetime import date
          import os

          today = date.fromisoformat(os.environ["TODAY_UTC"])
          month, day = map(int, os.environ["GOOGLE_PLAY_POLICY_MONTH_DAY"].split("-"))

          deadline = date(today.year, month, day)
          if today > deadline:
              deadline = date(today.year + 1, month, day)

          print(deadline.isoformat(), (deadline - today).days)
          PY
          )

          if (( DAYS_LEFT > GOOGLE_PLAY_POLICY_WARNING_DAYS )); then
            echo "Annual Google Play target-SDK review is not yet inside the warning window."
            exit 0
          fi

          ISSUE_TITLE="Android target SDK policy review due before ${NEXT_DEADLINE}"

          if gh issue list             --repo "${GITHUB_REPOSITORY}"             --state open             --limit 100             --json title             --jq '.[].title'             | grep -Fxq "${ISSUE_TITLE}"; then
            echo "Policy review issue already exists: ${ISSUE_TITLE}"
            exit 0
          fi

          BODY_FILE="${RUNNER_TEMP}/android-sdk-policy-review.md"
          cat > "${BODY_FILE}" <<EOF
          ## Google Play Android target SDK policy review

          The next annual policy checkpoint is **${NEXT_DEADLINE}** (${DAYS_LEFT} days away).

          Current repository guard baseline:
          - minimum target SDK: **API ${GOOGLE_PLAY_MIN_TARGET_SDK}**
          - minimum compile SDK: **API ${GOOGLE_PLAY_MIN_COMPILE_SDK}**
          - guarded file: `android/app/build.gradle`

          Before the deadline:
          1. Re-check the live Google Play target API policy.
          2. Raise the workflow constants if Google announces a newer required API level.
          3. Verify `compileSdk` and `targetSdk` remain compliant.
          4. Close this issue only after the live policy has been reviewed.

          Official source: ${GOOGLE_PLAY_POLICY_SOURCE}

          This issue is generated automatically by `.github/workflows/android_target_guard.yml`.
          EOF

          gh issue create             --repo "${GITHUB_REPOSITORY}"             --title "${ISSUE_TITLE}"             --body-file "${BODY_FILE}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify compileSdk and targetSdk
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY'
          from pathlib import Path
          import os
          import re
          import sys

          gradle_path = Path("android/app/build.gradle")
          text = gradle_path.read_text(encoding="utf-8")

          # Remove // comments before matching so commented-out SDK declarations
          # cannot satisfy the guard.
          active = "\n".join(line.split("//", 1)[0] for line in text.splitlines())

          def sdk_values(name: str) -> list[int]:
              pattern = re.compile(
                  rf"(?m)^\s*{name}(?:Version)?\s*(?:=\s*)?(\d+)\b"
              )
              return [int(match.group(1)) for match in pattern.finditer(active)]

          compile_values = sdk_values("compileSdk")
          target_values = sdk_values("targetSdk")

          if not compile_values:
              print(
                  "::error file=android/app/build.gradle::"
                  "No numeric compileSdk/compileSdkVersion declaration found."
              )
              sys.exit(1)

          if not target_values:
              print(
                  "::error file=android/app/build.gradle::"
                  "No numeric targetSdk/targetSdkVersion declaration found."
              )
              sys.exit(1)

          min_compile = int(os.environ["GOOGLE_PLAY_MIN_COMPILE_SDK"])
          min_target = int(os.environ["GOOGLE_PLAY_MIN_TARGET_SDK"])

          invalid_compile = [value for value in compile_values if value < min_compile]
          invalid_target = [value for value in target_values if value < min_target]

          if invalid_compile:
              print(
                  "::error file=android/app/build.gradle::"
                  f"compileSdk is below Google Play guard floor API {min_compile}: "
                  f"{invalid_compile}"
              )
              sys.exit(1)

          if invalid_target:
              print(
                  "::error file=android/app/build.gradle::"
                  f"targetSdk is below Google Play guard floor API {min_target}: "
                  f"{invalid_target}"
              )
              sys.exit(1)

          if min(compile_values) < max(target_values):
              print(
                  "::error file=android/app/build.gradle::"
                  "compileSdk must be greater than or equal to every targetSdk declaration."
              )
              sys.exit(1)

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as handle:
              handle.write("### Android target SDK guard\n\n")
              handle.write(f"- compileSdk values: `{compile_values}`\n")
              handle.write(f"- targetSdk values: `{target_values}`\n")
              handle.write(
                  f"- Google Play minimum target SDK guard: API `{min_target}`\n"
              )
              handle.write(
                  f"- Minimum compile SDK guard: API `{min_compile}`\n"
              )
              handle.write("- Result: **PASS**\n")

          print(
              "Android SDK guard PASS: "
              f"compileSdk={compile_values}, targetSdk={target_values}"
          )
          PY
