name: Multilingual Pack Builder Engine

on:
  schedule:
    # - cron: '0 * * * *' (disabled)
  workflow_dispatch:

jobs:
  build-and-expand:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Expansion Engine Safely
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 scripts/build_multilingual_packs.py

      - name: Validate System Contracts
        run: |
          python3 scripts/verify_contracts.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add assets/content/packs/
          if git diff --staged --quiet; then
            echo "لا توجد تعديلات جديدة للرفع."
            exit 0
          fi
          
          git commit -m "feat(content): automated multilingual pack expansion"
          git pull --rebase origin staging/v2-full-platform
          git push origin staging/v2-full-platform
