name: Project Record — Engineering CI Capture

on:
  workflow_run:
    workflows: [Engineering CI]
    types: [completed]

permissions:
  contents: read
  actions: none
  checks: none
  id-token: none
  pull-requests: none

concurrency:
  group: project-record-writer
  cancel-in-progress: false

jobs:
  capture:
    name: Capture Engineering CI result
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Record CI evidence
        env:
          PROJECT_RECORD_RUN_ID: ${{ github.event.workflow_run.id }}
          PROJECT_RECORD_WORKFLOW: Engineering CI
          PROJECT_RECORD_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          PROJECT_RECORD_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PROJECT_RECORD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GITHUB_EVENT_NAME: workflow_run
        run: |
          python3 tool/project_record_sync.py \
            --trigger "$GITHUB_EVENT_NAME" \
            --run-id "$PROJECT_RECORD_RUN_ID" \
            --workflow "$PROJECT_RECORD_WORKFLOW" \
            --conclusion "$PROJECT_RECORD_CONCLUSION" \
            --workflow-head-sha "$PROJECT_RECORD_HEAD_SHA" \
            --workflow-branch "$PROJECT_RECORD_BRANCH"

      - name: Commit record update
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/project-record
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ops: record Engineering CI result'
          # removed git push to prevent unauthenticated direct write
