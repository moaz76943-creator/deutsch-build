name: Project Record — Engineering CI Capture

on:
  workflow_run:
    workflows: [Engineering CI]
    types: [completed]

permissions:
  contents: read
  actions: none
  checks: none
  id-token: none
  pull-requests: none

concurrency:
  group: project-record-writer
  cancel-in-progress: false

jobs:
  capture:
    name: Capture Engineering CI result
    if: >-
      vars.GITHUB_ACTIONS_NONESSENTIAL_AUTOMATION_ENABLED == 'true' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record CI evidence
        env:
          PROJECT_RECORD_RUN_ID: ${{ github.event.workflow_run.id }}
          PROJECT_RECORD_WORKFLOW: Engineering CI
          PROJECT_RECORD_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          PROJECT_RECORD_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PROJECT_RECORD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GITHUB_EVENT_NAME: workflow_run
        run: |
          python3 tool/project_record_sync.py \
            --trigger "$GITHUB_EVENT_NAME" \
            --run-id "$PROJECT_RECORD_RUN_ID" \
            --workflow "$PROJECT_RECORD_WORKFLOW" \
            --conclusion "$PROJECT_RECORD_CONCLUSION" \
            --workflow-head-sha "$PROJECT_RECORD_HEAD_SHA" \
            --workflow-branch "$PROJECT_RECORD_BRANCH"

      - name: Upload project record artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: project-record-engineering-ci-${{ github.event.workflow_run.id }}
          path: docs/project-record/
          if-no-files-found: error
          retention-days: 7
