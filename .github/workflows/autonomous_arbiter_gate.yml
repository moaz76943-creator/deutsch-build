name: Autonomous Merge Arbiter Gate

on:
  pull_request:
    branches: [main, staging/v2-full-platform]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/project-record/**'
      - 'reports/automation/**'
      - 'tools/agents/state/**'

permissions:
  contents: read

concurrency:
  group: autonomous-arbiter-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  zero-drift-boundary:
    if: ${{ vars.GITHUB_ACTIONS_NONESSENTIAL_AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install asset pipeline test dependency
        run: python -m pip install --disable-pip-version-check --timeout 60 --retries 2 'Pillow==12.0.0'

      - name: Run autonomous-agent unit tests
        run: python -m unittest discover -s test/automation -p 'test_*.py'

      - name: Enforce zero-drift sentinel on changed files
        run: >-
          python tools/agents/anti_cheat_sentinel.py
          --repo-root .
          --changed "${{ github.event.pull_request.base.sha }}"
          --json-report reports/automation/anti_cheat_report.json

      - name: Dry-run merge tree and isolated auto-rebase
        run: >-
          python tools/agents/conflict_arbiter.py
          --repo-root .
          --base "${{ github.event.pull_request.base.sha }}"
          --source "${{ github.event.pull_request.head.sha }}"
          --auto-rebase
          --json-report reports/automation/arbiter_report.json
