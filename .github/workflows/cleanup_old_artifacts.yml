name: Cleanup Old Artifacts

on:
  schedule:
    - cron: '0 2 * * 0' # Weekly on Sunday at 02:00 UTC
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-old-artifacts
  cancel-in-progress: true

jobs:
  delete-artifacts:
    name: Delete artifacts older than 7 days
    if: >-
      github.event_name == 'workflow_dispatch' ||
      vars.GITHUB_ACTIONS_NONESSENTIAL_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete old workflow artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RETENTION_DAYS: '7'
        shell: bash
        run: |
          set -euo pipefail

          cutoff_epoch="$(date -u -d "${RETENTION_DAYS} days ago" +%s)"
          deleted=0

          while IFS=$'\t' read -r artifact_id created_at artifact_name; do
            [[ -z "${artifact_id}" ]] && continue

            created_epoch="$(date -u -d "${created_at}" +%s)"
            if (( created_epoch < cutoff_epoch )); then
              echo "Deleting artifact '${artifact_name}' (id=${artifact_id}, created=${created_at})"
              gh api --method DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/${REPOSITORY}/actions/artifacts/${artifact_id}"
              ((deleted += 1))
            fi
          done < <(
            gh api --paginate \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${REPOSITORY}/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired == false) | [.id, .created_at, .name] | @tsv'
          )

          echo "Deleted ${deleted} artifact(s) older than ${RETENTION_DAYS} days."
