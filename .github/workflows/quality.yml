name: Quality Gates

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/project-record/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: none
  checks: none
  id-token: none
  pull-requests: none

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Read toolchain.lock
        id: toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          source toolchain.lock
          printf 'flutter=%s\n' "$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"
          printf 'java=%s\n' "$JAVA_MAJOR" >> "$GITHUB_OUTPUT"
          printf 'gradle=%s\n' "$GRADLE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "${{ steps.toolchain.outputs.java }}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "${{ steps.toolchain.outputs.gradle }}"
          cache-disabled: true

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "${{ steps.toolchain.outputs.flutter }}"
          channel: stable
          cache: false
          pub-cache: false

      - name: Run Python regression tests
        run: |
          python3 -m pip install --upgrade pip pytest
          python3 -m pytest -q tests

      - name: Run quality and security gates
        run: |
          python3 tool/v233_build_path_compatibility.py
          python3 tool/privacy_audit.py
          python3 tool/security_audit.py
          python3 tool/quality_audit.py
          python3 tool/accessibility_audit.py
          python3 tool/architecture_audit.py
          python3 tool/weakness_gate.py
          python3 tool/content_pack.py validate
          python3 tool/content_ingestion.py validate

      - name: Materialize Flutter runtime content
        run: python3 tool/content_compiler.py compile --output-dir lib/data/generated

      - name: Analyze Flutter project
        run: |
          flutter pub get
          flutter analyze

      - name: Compile and verify canonical content
        run: |
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          python3 tool/content_compiler.py compile --output-dir "$tmp_dir/generated"
          python3 tool/content_compiler.py parity --output-dir "$tmp_dir/generated"
