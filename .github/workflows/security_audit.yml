name: Security Audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    paths:
      - 'pubspec.yaml'
      - 'pubspec.lock'

permissions:
  contents: read
  actions: none
  checks: none
  id-token: none
  pull-requests: none

concurrency:
  group: security-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: Offline-First Security Audit
    # Security is mandatory; the nonessential automation cost switch must not
    # silently disable it. One bounded Linux job, no schedules or paid runners.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Scan fetched Git history for secrets
        id: secrets
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          audit_dir="$(mktemp -d)"
          trap 'rm -rf "$audit_dir"' EXIT
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$audit_dir/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $audit_dir/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$audit_dir/gitleaks.tar.gz" -C "$audit_dir" gitleaks
          python3 tool/git_secret_audit.py --gitleaks "$audit_dir/gitleaks"

      - name: Enforce offline-first, tracking, and background-service policy
        id: policy
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import os
          import re
          import sys
          from pathlib import Path

          root = Path.cwd()
          findings: list[tuple[str, str]] = []

          def add(category: str, detail: str) -> None:
              findings.append((category, detail))

          def read_text(path: Path) -> str:
              if not path.exists():
                  return ""
              return path.read_text(encoding="utf-8", errors="ignore")

          lock_path = root / "pubspec.lock"
          if not lock_path.exists():
              add("DEPENDENCIES", "pubspec.lock is missing; resolved dependencies cannot be audited.")
              packages: dict[str, str] = {}
          else:
              packages = {}
              current: str | None = None
              for line in read_text(lock_path).splitlines():
                  match = re.match(r"^  ([A-Za-z0-9_]+):\s*$", line)
                  if match:
                      current = match.group(1)
                      packages[current] = ""
                      continue
                  if current:
                      dep = re.match(r"^    dependency:\s*(.+?)\s*$", line)
                      if dep:
                          packages[current] = dep.group(1).strip('"')

          forbidden_packages = {
              # External network/data paths incompatible with a strict offline-only runtime.
              "http": ("OFFLINE-FIRST", "HTTP client capability"),
              "dio": ("OFFLINE-FIRST", "HTTP client capability"),
              "chopper": ("OFFLINE-FIRST", "HTTP client capability"),
              "retrofit": ("OFFLINE-FIRST", "HTTP client capability"),
              "graphql": ("OFFLINE-FIRST", "GraphQL network capability"),
              "graphql_flutter": ("OFFLINE-FIRST", "GraphQL network capability"),
              "ferry": ("OFFLINE-FIRST", "GraphQL network capability"),
              "web_socket": ("OFFLINE-FIRST", "WebSocket network capability"),
              "web_socket_channel": ("OFFLINE-FIRST", "WebSocket network capability"),
              "cached_network_image": ("OFFLINE-FIRST", "runtime network image fetching"),
              # Tracking, analytics, attribution, ads, telemetry, or remote reporting.
              "firebase_analytics": ("TRACKING", "analytics/telemetry SDK"),
              "firebase_crashlytics": ("TRACKING", "remote crash-reporting SDK"),
              "firebase_performance": ("TRACKING", "remote performance telemetry SDK"),
              "sentry_flutter": ("TRACKING", "remote error/telemetry SDK"),
              "amplitude_flutter": ("TRACKING", "analytics SDK"),
              "mixpanel_flutter": ("TRACKING", "analytics SDK"),
              "posthog_flutter": ("TRACKING", "analytics SDK"),
              "appsflyer_sdk": ("TRACKING", "attribution/tracking SDK"),
              "adjust_sdk": ("TRACKING", "attribution/tracking SDK"),
              "facebook_app_events": ("TRACKING", "app-events tracking SDK"),
              "onesignal_flutter": ("TRACKING", "remote messaging/telemetry SDK"),
              "google_mobile_ads": ("TRACKING", "network advertising SDK"),
              # Persistent/scheduled background execution packages.
              "workmanager": ("BACKGROUND", "background work scheduler"),
              "background_fetch": ("BACKGROUND", "background fetch scheduler"),
              "flutter_background_service": ("BACKGROUND", "persistent background service"),
              "flutter_foreground_task": ("BACKGROUND", "foreground/background task service"),
              "android_alarm_manager_plus": ("BACKGROUND", "scheduled background execution"),
          }

          for package, (category, reason) in sorted(forbidden_packages.items()):
              if package not in packages:
                  continue
              scope = packages.get(package) or "unknown scope"
              if scope == "direct dev":
                  continue
              # Generic network libraries are blocked when they are runtime dependencies.
              # Tracking/background capabilities remain blocking when pulled transitively.
              if category == "OFFLINE-FIRST" and scope != "direct main":
                  continue
              add(category, f"Package '{package}' ({scope}) provides {reason}.")

          # Catch obvious unapproved telemetry/background SDK variants not yet in the exact denylist.
          suspicious_name_patterns = {
              "TRACKING": (
                  r"(^|_)(analytics|telemetry|tracking|appsflyer|mixpanel|amplitude|posthog|crashlytics|newrelic|datadog)(_|$)",
              ),
              "BACKGROUND": (
                  r"(^|_)(background_service|background_fetch|foreground_task|workmanager|alarm_manager)(_|$)",
              ),
          }
          exact_known = set(forbidden_packages)
          for package in sorted(packages):
              if package in exact_known or packages.get(package) == "direct dev":
                  continue
              for category, patterns in suspicious_name_patterns.items():
                  if any(re.search(pattern, package, re.IGNORECASE) for pattern in patterns):
                      add(category, f"Package '{package}' matches a restricted {category.lower()} capability pattern.")

          dart_files = sorted((root / "lib").rglob("*.dart")) if (root / "lib").exists() else []
          dart_source = "\n".join(read_text(path) for path in dart_files)

          if "google_fonts" in packages and not re.search(
              r"GoogleFonts\.config\.allowRuntimeFetching\s*=\s*false",
              dart_source,
          ):
              add(
                  "OFFLINE-FIRST",
                  "Package 'google_fonts' is present but runtime fetching is not explicitly disabled.",
              )

          source_patterns = {
              "OFFLINE-FIRST": (
                  (r"package:http/", "package:http import"),
                  (r"package:dio/", "package:dio import"),
                  (r"\bHttpClient\s*\(", "dart:io HttpClient"),
                  (r"\bWebSocket\.connect\s*\(", "WebSocket connection"),
                  (r"\bSocket\.connect\s*\(", "socket connection"),
                  (r"https?://", "runtime HTTP(S) URL"),
              ),
              "TRACKING": (
                  (r"\bFirebaseAnalytics\b", "Firebase Analytics"),
                  (r"\bSentryFlutter\b", "Sentry telemetry"),
                  (r"\bMixpanel\b", "Mixpanel analytics"),
                  (r"package:(?:amplitude_flutter|amplitude_dart)/|\bAmplitude\s*(?:\(|\.\s*getInstance\s*\()", "Amplitude analytics"),
                  (r"\bAppsFlyer", "AppsFlyer attribution"),
                  (r"package:adjust_sdk/|\bAdjust\s*\.\s*(?:start|initSdk|trackEvent)\s*\(", "Adjust attribution"),
                  (r"\bPosthog\b|\bPostHog\b", "PostHog analytics"),
              ),
          }
          for category, checks in source_patterns.items():
              for pattern, label in checks:
                  if re.search(pattern, dart_source, re.IGNORECASE):
                      add(category, f"Dart runtime source contains {label} capability.")

          android_root = root / "android" / "app" / "src"
          native_files = []
          if android_root.exists():
              native_files = sorted(
                  path
                  for path in android_root.rglob("*")
                  if path.is_file() and path.suffix.lower() in {".xml", ".kt", ".java"}
              )

          background_native_patterns = (
              (r"<service\b", "Android <service> declaration"),
              (r"android\.permission\.FOREGROUND_SERVICE", "FOREGROUND_SERVICE permission"),
              (r"android\.permission\.WAKE_LOCK", "WAKE_LOCK permission"),
              (r"android\.permission\.RECEIVE_BOOT_COMPLETED", "RECEIVE_BOOT_COMPLETED permission"),
              (r"android\.permission\.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS", "battery-optimization bypass permission"),
              (r"android\.permission\.SCHEDULE_EXACT_ALARM", "exact-alarm permission"),
              (r"\bextends\s+Service\b", "native Android Service"),
              (r":\s*Service\s*\(", "native Kotlin Service"),
              (r"\bJobService\b|\bJobScheduler\b", "Android job scheduler"),
              (r"\bWorkManager\b|\bCoroutineWorker\b|\bListenableWorker\b", "Android WorkManager"),
              (r"\bAlarmManager\b", "Android AlarmManager"),
              (r"\bstartForegroundService\s*\(|\bstartService\s*\(", "explicit Android service start"),
          )
          network_native_patterns = (
              (r"android\.permission\.INTERNET", "INTERNET permission"),
              (r"android\.permission\.ACCESS_NETWORK_STATE", "ACCESS_NETWORK_STATE permission"),
              (r"android\.permission\.CHANGE_NETWORK_STATE", "CHANGE_NETWORK_STATE permission"),
              (r"\bokhttp3\b", "OkHttp network client"),
              (r"\bHttpURLConnection\b", "HttpURLConnection"),
              (r"\bjava\.net\.URL\b", "java.net.URL"),
          )

          for path in native_files:
              text = read_text(path)
              rel = path.relative_to(root)
              for pattern, label in background_native_patterns:
                  if re.search(pattern, text, re.IGNORECASE):
                      add("BACKGROUND", f"{rel}: {label}.")
              for pattern, label in network_native_patterns:
                  if re.search(pattern, text, re.IGNORECASE):
                      add("OFFLINE-FIRST", f"{rel}: {label}.")

          gradle_files = sorted((root / "android").rglob("*.gradle")) if (root / "android").exists() else []
          gradle_files += sorted((root / "android").rglob("*.gradle.kts")) if (root / "android").exists() else []
          gradle_source = "\n".join(read_text(path) for path in gradle_files)
          gradle_markers = {
              "TRACKING": (
                  "firebase-analytics",
                  "firebase-crashlytics",
                  "play-services-ads",
                  "appsflyer",
                  "adjust-android",
                  "facebook-android-sdk",
                  "onesignal",
                  "sentry-android",
              ),
              "BACKGROUND": (
                  "androidx.work:work-runtime",
                  "work-runtime-ktx",
              ),
          }
          for category, markers in gradle_markers.items():
              for marker in markers:
                  if marker.lower() in gradle_source.lower():
                      add(category, f"Android Gradle dependency contains restricted marker '{marker}'.")

          unique_findings: list[tuple[str, str]] = []
          seen: set[tuple[str, str]] = set()
          for item in findings:
              if item not in seen:
                  unique_findings.append(item)
                  seen.add(item)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          report_lines = ["## Offline-First policy audit"]
          if unique_findings:
              print("SECURITY POLICY AUDIT: FAIL")
              for index, (category, detail) in enumerate(unique_findings, 1):
                  print(f"{index:02d}. [{category}] {detail}")
                  report_lines.append(f"- **{category}** — {detail}")
              if summary_path:
                  Path(summary_path).open("a", encoding="utf-8").write("\n".join(report_lines) + "\n")
              sys.exit(1)

          print("SECURITY POLICY AUDIT: PASS")
          print("No unauthorized network, tracking, or background-service capability was detected.")
          report_lines.append("- PASS — no restricted runtime capability detected.")
          if summary_path:
              Path(summary_path).open("a", encoding="utf-8").write("\n".join(report_lines) + "\n")
          PY

      - name: Scan locked Dart dependencies for known vulnerabilities
        id: osv
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@7f58dd6750d78fc29a900ba64b1a0f946f62fba4 # v2.6.0
        with:
          scan-args: |-
            --lockfile=pubspec.lock

      - name: Enforce security decision
        if: always()
        shell: bash
        env:
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          OSV_OUTCOME: ${{ steps.osv.outcome }}
          SECRETS_OUTCOME: ${{ steps.secrets.outcome }}
        run: |
          set -Eeuo pipefail
          {
            echo
            echo "## Security audit decision"
            echo "- Offline-first / tracking / background policy: ${POLICY_OUTCOME}"
            echo "- Known-vulnerability scan (OSV): ${OSV_OUTCOME}"
            echo "- Fetched Git history secrets scan: ${SECRETS_OUTCOME}"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          if [[ "$SECRETS_OUTCOME" != "success" ]]; then
            echo "::error title=Git history secrets audit::Findings or incomplete scan; publication remains blocked. Review metadata without exposing credentials."
            failed=1
          fi
          if [[ "$POLICY_OUTCOME" != "success" ]]; then
            echo "::error title=Offline-First security policy::Restricted package, tracking capability, network path, or background service detected."
            failed=1
          fi
          if [[ "$OSV_OUTCOME" != "success" ]]; then
            echo "::error title=Known dependency vulnerability::OSV-Scanner found a vulnerability or could not complete the scan. Review the OSV step output."
            failed=1
          fi

          if [[ "$failed" -ne 0 ]]; then
            echo "SECURITY AUDIT: FAIL"
            exit 1
          fi

          echo "SECURITY AUDIT: PASS"
