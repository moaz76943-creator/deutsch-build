name: Staging self-check

# One automatic private-repo check sized for GitHub Free's 2,000 Linux
# minutes per month. It does not use
# GITHUB_ACTIONS_NONESSENTIAL_AUTOMATION_ENABLED: that switch also starts
# the rest of the opt-in workflows and would exhaust the quota.
# Pull requests only, so a merge does not run the same SHA twice.
# cancel-in-progress drops superseded runs. The 20 minute cap stops a
# hung Flutter job from consuming the default six-hour limit.

on:
  pull_request:
    branches:
      - staging/v2-full-platform
    paths:
      - "lib/**"
      - "test/**"
      - "android/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "toolchain.lock"
      - "assets/fonts/OFL*.txt"
      - ".github/workflows/staging_self_check.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: staging-self-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate build-tooling regression contracts
        run: |
          python3 -m unittest discover -s tests -p 'test_build_tooling_contract.py' -v
          python3 -m unittest discover -s tests -p 'test_workflow_conflict_recovery.py' -v

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: false

      - name: Install locked Android SDK packages
        shell: bash
        run: |
          set -Eeuo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          source toolchain.lock
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-$ANDROID_COMPILE_SDK" \
            "build-tools;$ANDROID_BUILD_TOOLS_VERSION" \
            "ndk;$ANDROID_NDK_VERSION"

      - name: Verify Gradle wrapper and locked distribution
        run: |
          python3 tool/gradle_wrapper_bootstrap.py
          python3 tool/gradle_wrapper_integrity.py

      - name: Play compliance
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - << 'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          manifest = ET.parse(manifest_path).getroot()
          gradle = Path("android/app/build.gradle").read_text(encoding="utf-8")

          android_ns = "{http://schemas.android.com/apk/res/android}"
          tools_ns = "{http://schemas.android.com/tools}"
          required_attributes = {
              "allowBackup": "false",
              "usesCleartextTraffic": "false",
          }
          application = manifest.find("application")
          missing = []
          if application is None:
              missing.append("application")
          else:
              for attribute, expected in required_attributes.items():
                  if application.get(android_ns + attribute) != expected:
                      missing.append(f"android:{attribute}={expected}")

          permissions = manifest.findall("uses-permission")
          record_audio = any(
              node.get(android_ns + "name") == "android.permission.RECORD_AUDIO"
              and node.get(tools_ns + "node") != "remove"
              for node in permissions
          )
          if not record_audio:
              missing.append("android.permission.RECORD_AUDIO")

          forbidden = {
              "android.permission.INTERNET",
              "android.permission.POST_NOTIFICATIONS",
          }
          active_forbidden = sorted({
              node.get(android_ns + "name")
              for node in permissions
              if node.get(android_ns + "name") in forbidden
              and node.get(tools_ns + "node") != "remove"
          })

          if "targetSdk 36" not in gradle:
              missing.append("targetSdk 36")
          if "compileSdk 36" not in gradle:
              missing.append("compileSdk 36")

          if missing or active_forbidden:
              raise SystemExit(
                  f"Play compliance failed missing={missing} "
                  f"active_forbidden={active_forbidden}"
              )
          print("Play compliance ok: forbidden permissions are absent or explicitly removed")
          PY

      - name: Read locked Flutter version
        id: toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          source toolchain.lock
          printf 'flutter=%s\n' "$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.toolchain.outputs.flutter }}
          channel: stable
          cache: true

      - name: Resolve dependencies and refresh lockfile once
        run: flutter pub get

      - name: Upload resolved pubspec.lock for canonical update
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deutsch-bilarabi-resolved-pubspec-lock
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Analyze
        run: dart analyze lib/

      - name: Flutter tests that guard learner data
        run: >-
          flutter test --reporter compact
          test/core/database/bootstrap/database_bootstrapper_test.dart
          test/services/delta_patch_service_test.dart
          test/services/srs_scheduler_persisted_counter_integrity_test.dart
          test/services/lemmatization_service_test.dart
          test/jules/J049/trie_search_engine_test.dart
          test/jules/WS16/
          test/offline_gate_test.dart

      - name: Full Flutter test suite
        run: flutter test --reporter compact

      - name: Release preflight
        run: python3 deutsch_release_preflight.py

      - name: Build installable ARM64 Debug APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: Verify Debug APK and record SHA-256
        shell: bash
        run: |
          set -Eeuo pipefail
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          test -s "$APK"
          mkdir -p build-receipts
          sha256sum "$APK" | tee build-receipts/debug-apk.sha256
          stat --printf='APK_SIZE_BYTES=%s\\n' "$APK" | tee build-receipts/debug-apk-size.txt

      - name: Upload verified ARM64 Debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deutsch-bilarabi-staging-arm64-debug
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build-receipts/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Merge into staging when this check is green
        if: github.event.pull_request.draft == false
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          if gh pr merge "$PR_NUMBER" --merge --repo "$GITHUB_REPOSITORY"; then
            echo "Merged PR #$PR_NUMBER into staging/v2-full-platform"
          else
            echo "Analyze and Flutter tests passed. GitHub did not merge PR #$PR_NUMBER."
            exit 0
          fi
