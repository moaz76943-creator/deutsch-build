name: Build and Release Direct APK

on:
  # Manual-only publishing; keep analyze and tests as hard release prerequisites.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate workflow regression contracts
        run: python3 -m unittest discover -s tests -p 'test_workflow_conflict_recovery.py' -v

      - name: Setup Java Development Kit
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Read locked toolchain
        shell: bash
        id: toolchain
        run: |
          set -Eeuo pipefail
          source toolchain.lock
          printf 'flutter=%s\n' "$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter Framework
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "${{ steps.toolchain.outputs.flutter }}"
          cache: true

      - name: Install Dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run static analysis before build
        run: dart analyze lib/

      - name: Run tests before build
        run: flutter test

      - name: Build Split APKs
        run: flutter build apk --release --split-per-abi

      - name: Prepare Single APK
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ./deutsch-app.apk

      - name: Verify APK and create SHA-256 receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s deutsch-app.apk
          sha256sum deutsch-app.apk > deutsch-app.apk.sha256
          sha256sum --check deutsch-app.apk.sha256
      - name: Publish Direct APK Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "deutsch-app.apk,deutsch-app.apk.sha256"
          tag: "latest"
          allowUpdates: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
