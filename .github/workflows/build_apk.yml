name: Pro Automated Build & Release

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Secure, Optimize & Release
    runs-on: ubuntu-latest

    steps:
      - name: 1. جلب الكود من المستودع
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. إعداد بيئة Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. تفعيل الكاش الذكي لتسريع أندرويد و Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 4. إعداد بيئة Flutter المستقرة
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 5. تنزيل وتحديث الحزم المتوافقة
        run: flutter pub get

      - name: 6. التحقق البرمجي التلقائي الصارم
        run: flutter analyze

      - name: 7. فحص الأمان والثغرات التلقائي للمستودع
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL'
          exit-code: '0'

      - name: 8. توليد النسخ الخفيفة والمحسنة (Split APKs)
        run: flutter build apk --debug --split-per-abi

      - name: 9. تجهيز سجل التعديلات التلقائي (Changelog)
        id: changelog
        run: |
          echo "CHANGES<<EOF" >> $GITHUB_ENV
          git log -1 --pretty=format:"* %s (%h)" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: 10. تنظيف الإصدارات القديمة تلقائياً (إبقاء آخر 3 فقط)
        uses: dev-drprasad/delete-older-releases@v0.3.3
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 11. نشر النسخ بروابط تحميل مباشرة (.apk)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: latest
          name: "أحدث نسخة تجريبية جاهزة للتثبيت"
          body: |
            ### 🚀 آخر التحديثات في هذه النسخة:
            ${{ env.CHANGES }}

            ---
            * **app-arm64-v8a-debug.apk**: النسخة الخفيفة الموصى بها للهواتف الحديثة.
            * **app-armeabi-v7a-debug.apk**: نسخة الأجهزة القديمة.
          files: build/app/outputs/flutter-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
