name: Legacy Split APK (manual only; no automatic publish)

# Superseded by Android Continuous APK (staging).
# Keep manual path for legacy comparisons without duplicate push builds or publishing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Framework
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Split APKs
        run: flutter build apk --release --split-per-abi

      - name: Prepare Single APK
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ./deutsch-app.apk

      - name: Upload legacy APK artifact (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: legacy-arm64-apk
          path: deutsch-app.apk
          if-no-files-found: error
          retention-days: 7
