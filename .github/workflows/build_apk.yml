name: Pro Build, Release & Web Preview (Manual)

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: manual-pro-build-release
  cancel-in-progress: false

jobs:
  build:
    name: Build APK & Web Preview
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout requested ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read locked toolchain
        id: toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          source toolchain.lock
          printf 'flutter=%s\n' "$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"
          printf 'java=%s\n' "$JAVA_MAJOR" >> "$GITHUB_OUTPUT"
          printf 'gradle=%s\n' "$GRADLE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "${{ steps.toolchain.outputs.java }}"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70
        with:
          gradle-version: "${{ steps.toolchain.outputs.gradle }}"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "${{ steps.toolchain.outputs.flutter }}"
          channel: stable
          cache: true

      - name: Fetch dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze

      - name: Build split debug APKs
        run: flutter build apk --debug --split-per-abi

      - name: Build web preview
        run: flutter build web --base-href "/${{ github.event.repository.name }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: build/web

      - name: Deploy Pages preview
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

      - name: Capture changelog
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo "CHANGES<<EOF"
            git log -1 --pretty=format:'* %s (%h)'
            echo
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Publish APK download links
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: latest
          name: "أحدث نسخة تجريبية جاهزة للتثبيت"
          body: |
            ### 🚀 آخر التحديثات:
            ${{ env.CHANGES }}

            ---
            * 🌐 **رابط معاينة الواجهات على المتصفح مباشرة:** https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
            * 📱 **app-arm64-v8a-debug.apk**: النسخة الموصى بها لهاتفك.
          files: build/app/outputs/flutter-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
