name: Build and Release Direct APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Read locked toolchain
        shell: bash
        id: toolchain
        run: |
          set -Eeuo pipefail
          source toolchain.lock
          printf 'flutter=%s\n' "$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter Framework
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "${{ steps.toolchain.outputs.flutter }}"
          cache: true

      - name: Install Dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run static analysis before build
        run: dart analyze lib/

      - name: Run tests before build
        run: flutter test

      - name: Build Split APKs
        run: flutter build apk --release --split-per-abi

      - name: Prepare Single APK
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ./deutsch-app.apk

      - name: Publish Direct APK Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "deutsch-app.apk"
          tag: "latest"
          allowUpdates: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
