name: Pro Build, Release & Web Preview

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build APK & Web Preview
    runs-on: ubuntu-latest

    steps:
      - name: 1. جلب الكود من المستودع
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: 2. إعداد بيئة Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. تفعيل الكاش الذكي لتسريع أندرويد
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70

      - name: 4. إعداد بيئة Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: 'stable'
          cache: true

      - name: 5. تنزيل الحزم وتوليد الأصول
        run: flutter pub get

      - name: 6. الفحص البرمجي التلقائي
        run: flutter analyze

      - name: 7. توليد النسخ الخفيفة (Split APKs)
        run: flutter build apk --debug --split-per-abi

      - name: 8. بناء نسخة المعاينة الحية للويب
        run: flutter build web --base-href "/${{ github.event.repository.name }}/"

      - name: 9. نشر المعاينة الحية على صفحات GitHub Pages
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: build/web

      - name: 10. تفعيل رابط المعاينة المباشر
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

      - name: 11. استخراج سجل التعديلات
        id: changelog
        run: |
          echo "CHANGES<<EOF" >> $GITHUB_ENV
          git log -1 --pretty=format:"* %s (%h)" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: 12. تنظيف الإصدارات القديمة (إبقاء آخر 3 فقط)
        uses: dev-drprasad/delete-older-releases@0bf4e6748f08135170c2294f877ba7d9b633b028
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 13. نشر روابط تحميل ملفات الـ APK
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: latest
          name: "أحدث نسخة تجريبية جاهزة للتثبيت"
          body: |
            ### 🚀 آخر التحديثات:
            ${{ env.CHANGES }}

            ---
            * 🌐 **رابط معاينة الواجهات على المتصفح مباشرة:** https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
            * 📱 **app-arm64-v8a-debug.apk**: النسخة الموصى بها لهاتفك.
          files: build/app/outputs/flutter-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
