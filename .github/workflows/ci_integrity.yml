name: CI Integrity & Code Quality Gate

on:
  push:
    branches:
      - main
      - staging/v2-full-platform
  workflow_dispatch:

jobs:
  verify-project:
    runs-on: ubuntu-latest
    steps:
      - name: تحميل المستودع (Checkout)
        uses: actions/checkout@v4

      - name: إعداد بيئة جافا (Java 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: إعداد Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: جلب المكتبات (Pub Get)
        run: flutter pub get

      - name: الفحص البرمجي للتحقق من الأخطاء (Dart Analyze)
        run: dart analyze --no-fatal-infos --no-fatal-warnings lib/

      - name: تشغيل الفحص المسبق لقواعد البيانات والأصول
        run: python3 deutsch_release_preflight.py
