name: PR Architectural Guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  actions: none
  checks: none
  id-token: none
  issues: write
  pull-requests: read

concurrency:
  group: pr-architectural-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  architectural-guard:
    if: ${{ vars.GITHUB_ACTIONS_NONESSENTIAL_AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect added diff lines and report
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- pr-architectural-guard -->';
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const expectedChangedFiles = context.payload.pull_request.changed_files ?? 0;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });

            const forbiddenNetworkPermissions = [
              'android.permission.INTERNET',
              'android.permission.ACCESS_NETWORK_STATE',
              'android.permission.CHANGE_NETWORK_STATE',
              'android.permission.ACCESS_WIFI_STATE',
              'android.permission.CHANGE_WIFI_STATE',
            ];

            const isManifest = (path) => /(^|\/)AndroidManifest\.xml$/.test(path);
            const isPresentationOrCore = (path) =>
              /(^|\/)(presentation|core)(\/|$)/.test(path);
            const directPreferences =
              /\bSharedPreferences\b|package:shared_preferences\//;

            function addedLines(patch) {
              const additions = [];
              let newLine = 0;

              for (const row of patch.split('\n')) {
                const header = row.match(
                  /^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@/,
                );
                if (header) {
                  newLine = Number(header[1]);
                  continue;
                }

                if (row.startsWith('+++') || row.startsWith('---')) {
                  continue;
                }
                if (row.startsWith('+')) {
                  additions.push({ line: newLine, text: row.slice(1) });
                  newLine += 1;
                  continue;
                }
                if (row.startsWith('-') || row.startsWith('\\')) {
                  continue;
                }
                if (newLine > 0) {
                  newLine += 1;
                }
              }

              return additions;
            }

            const violations = [];
            let manifestFiles = 0;
            let manifestAddedLines = 0;
            let boundaryFiles = 0;
            let boundaryAddedLines = 0;

            if (expectedChangedFiles > files.length) {
              violations.push({
                rule: 'Diff completeness',
                path: '(pull request)',
                line: null,
                text: `${expectedChangedFiles} changed files reported but only ${files.length} were available from the API`,
                message: 'The complete PR diff could not be inspected; fail-closed manual review is required.',
              });
            }

            for (const file of files) {
              const paths = [file.filename, file.previous_filename].filter(Boolean);
              const manifestRelevant = paths.some(isManifest);
              const boundaryRelevant = paths.some(isPresentationOrCore);

              if (!manifestRelevant && !boundaryRelevant) {
                continue;
              }

              if (manifestRelevant) {
                manifestFiles += 1;
              }
              if (boundaryRelevant) {
                boundaryFiles += 1;
              }

              if (!file.patch) {
                if ((file.additions ?? 0) > 0) {
                  violations.push({
                    rule: manifestRelevant
                      ? 'Offline-First network permissions'
                      : 'Persistence boundary',
                    path: file.filename,
                    line: null,
                    text: 'patch unavailable',
                    message: 'Security-sensitive file has added lines but GitHub did not provide a patch; fail-closed manual review is required.',
                  });
                }
                continue;
              }

              const additions = addedLines(file.patch);

              if (manifestRelevant) {
                manifestAddedLines += additions.length;
                for (const added of additions) {
                  const permission = forbiddenNetworkPermissions.find((value) =>
                    added.text.includes(value),
                  );
                  if (permission) {
                    violations.push({
                      rule: 'Offline-First network permissions',
                      path: file.filename,
                      line: added.line,
                      text: added.text.trim(),
                      message: `Forbidden network permission added: ${permission}`,
                    });
                  }
                }
              }

              if (boundaryRelevant) {
                boundaryAddedLines += additions.length;
                for (const added of additions) {
                  if (directPreferences.test(added.text)) {
                    violations.push({
                      rule: 'Persistence boundary',
                      path: file.filename,
                      line: added.line,
                      text: added.text.trim(),
                      message: 'Direct SharedPreferences usage/import added under a presentation/core path.',
                    });
                  }
                }
              }
            }

            const networkBlocked = violations.some(
              (item) =>
                item.rule === 'Offline-First network permissions' ||
                item.rule === 'Diff completeness',
            );
            const persistenceBlocked = violations.some(
              (item) =>
                item.rule === 'Persistence boundary' ||
                item.rule === 'Diff completeness',
            );
            const blocked = violations.length > 0;

            const rows = [
              `| Offline-First: no added network permissions in AndroidManifest.xml | ${networkBlocked ? '❌ BLOCKED' : '✅ PASS'} | ${manifestFiles} relevant file(s), ${manifestAddedLines} added line(s) inspected |`,
              `| Persistence boundary: no direct SharedPreferences in presentation/core | ${persistenceBlocked ? '❌ BLOCKED' : '✅ PASS'} | ${boundaryFiles} relevant file(s), ${boundaryAddedLines} added line(s) inspected |`,
            ];

            const details = violations.slice(0, 25).map((item) => {
              const location =
                item.line == null ? item.path : `${item.path}:${item.line}`;
              const snippet = String(item.text || '')
                .replace(/`/g, '\\`')
                .slice(0, 220);
              return `- **${item.rule}** — \`${location}\`: ${item.message}${snippet ? ` — \`${snippet}\`` : ''}`;
            });

            if (violations.length > 25) {
              details.push(`- …and ${violations.length - 25} additional violation(s).`);
            }

            const body = [
              marker,
              '## PR Architectural Guard',
              '',
              `**Result:** ${blocked ? '❌ BLOCKED' : '✅ ARCHITECTURALLY COMPLIANT'}`,
              '',
              '| Guard rule | Status | Diff evidence |',
              '| --- | --- | --- |',
              ...rows,
              '',
              blocked
                ? '### Violations'
                : 'No prohibited additions were found in the inspected diff.',
              ...(blocked ? details : []),
              '',
              `Inspected PR head: \`${context.payload.pull_request.head.sha}\``,
              '',
              '_This guard inspects added diff lines only and does not check out or execute PR code._',
            ].join('\n');

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: pull_number, per_page: 100 },
            );
            const existing = comments.find(
              (comment) =>
                comment.user?.login === 'github-actions[bot]' &&
                comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body,
              });
            }

            if (blocked) {
              core.setFailed(
                `Architectural guard blocked the PR with ${violations.length} violation(s).`,
              );
            }
