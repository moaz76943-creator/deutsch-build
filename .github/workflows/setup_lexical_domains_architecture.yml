name: "ورشة هندسة المحتوى المعجمي والـ 50 مجالاً للغات"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-lexical-core:
    runs-on: ubuntu-latest
    steps:
      - name: جلب كود المستودع
        uses: actions/checkout@v7

      - name: إعداد بيئة Dart و Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: إعداد بيئة بايثون للتحقق المعجمي
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: تجهيز حزم المشروع ومسارات الأصول
        run: |
          mkdir -p assets/data/domains assets/data/packs
          touch assets/data/domains/.gitkeep assets/data/packs/.gitkeep
          flutter pub get

