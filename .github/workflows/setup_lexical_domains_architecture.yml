            static String getDomainName(String domainId) {
              final domain = domains.firstWhere(
                (d) => d['id'] == domainId || d['key'] == domainId,
                orElse: () => {'nameAr': 'عام'},
              );
              return domain['nameAr'] ?? 'عام';
            }
