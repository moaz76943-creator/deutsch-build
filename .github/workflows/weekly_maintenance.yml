name: Weekly Maintenance

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: none
  checks: none
  id-token: none
  pull-requests: none

concurrency:
  group: weekly-maintenance
  cancel-in-progress: true

jobs:
  maintenance:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      vars.GITHUB_ACTIONS_NONESSENTIAL_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Flutter toolchain
        id: toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          source toolchain.lock
          printf 'flutter=%s\n' "$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "${{ steps.toolchain.outputs.flutter }}"
          channel: stable
          cache: false
          pub-cache: false

      - name: Audit dependencies and generated content
        id: audit
        shell: bash
        run: |
          set -Eeuo pipefail

          REPORT="$GITHUB_WORKSPACE/weekly-maintenance-report.md"
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT

          set +e
          flutter pub outdated --json >"$WORK/outdated.json" 2>"$WORK/outdated.err"
          deps_status=$?

          python3 tool/content_pack.py validate >"$WORK/content.log" 2>&1
          pack_status=$?

          python3 tool/content_ingestion.py validate >>"$WORK/content.log" 2>&1
          ingestion_status=$?

          python3 tool/content_compiler.py compile --output-dir "$WORK/generated" >>"$WORK/content.log" 2>&1
          compile_status=$?

          parity_status=99
          drift_status=99
          if [[ "$compile_status" -eq 0 ]]; then
            python3 tool/content_compiler.py parity --output-dir "$WORK/generated" >>"$WORK/content.log" 2>&1
            parity_status=$?
            diff -qr "$WORK/generated" lib/data/generated >"$WORK/generated.diff" 2>&1
            drift_status=$?
          fi
          set -e

          export deps_status pack_status ingestion_status compile_status parity_status drift_status
          export OUTDATED_JSON="$WORK/outdated.json"
          export OUTDATED_ERR="$WORK/outdated.err"
          export CONTENT_LOG="$WORK/content.log"
          export GENERATED_DIFF="$WORK/generated.diff"
          export REPORT

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def version(value):
              if isinstance(value, dict):
                  return value.get("version")
              if isinstance(value, str):
                  return value
              return None

          deps_status = int(os.environ["deps_status"])
          pack_status = int(os.environ["pack_status"])
          ingestion_status = int(os.environ["ingestion_status"])
          compile_status = int(os.environ["compile_status"])
          parity_status = int(os.environ["parity_status"])
          drift_status = int(os.environ["drift_status"])

          safe_updates = []
          parse_error = None
          if deps_status == 0:
              try:
                  data = json.loads(Path(os.environ["OUTDATED_JSON"]).read_text(encoding="utf-8"))
                  for package in data.get("packages", []):
                      current = version(package.get("current"))
                      upgradable = version(package.get("upgradable"))
                      if current and upgradable and current != upgradable:
                          safe_updates.append(
                              (package.get("package", "unknown"), current, upgradable)
                          )
              except Exception as exc:
                  parse_error = str(exc)

          dependency_problem = deps_status != 0 or parse_error is not None
          content_problem = any(
              status != 0
              for status in (
                  pack_status,
                  ingestion_status,
                  compile_status,
                  parity_status,
                  drift_status,
              )
          )
          needs_issue = bool(safe_updates or dependency_problem or content_problem)

          lines = [
              "## Weekly maintenance report",
              "",
              f"- Commit: `{os.environ.get('GITHUB_SHA', 'unknown')}`",
              f"- Safe dependency updates: **{len(safe_updates)}**",
              f"- Content pack validation: **{'PASS' if pack_status == 0 else 'FAIL'}**",
              f"- Content ingestion validation: **{'PASS' if ingestion_status == 0 else 'FAIL'}**",
              f"- Generated-content compile: **{'PASS' if compile_status == 0 else 'FAIL'}**",
              f"- Generated-content parity: **{'PASS' if parity_status == 0 else 'FAIL'}**",
              f"- Checked-in generated files match compiler output: **{'PASS' if drift_status == 0 else 'FAIL'}**",
              "",
          ]

          if safe_updates:
              lines.append("### Dependency updates available within current constraints")
              for name, current, upgradable in safe_updates:
                  lines.append(f"- `{name}`: `{current}` → `{upgradable}`")
              lines.append("- Action: review and apply manually; this workflow never changes dependencies.")
              lines.append("")

          if dependency_problem:
              lines.append("### Dependency audit problem")
              if deps_status != 0:
                  err = Path(os.environ["OUTDATED_ERR"]).read_text(encoding="utf-8", errors="replace").strip()
                  lines.append(f"- `flutter pub outdated --json` exited with status `{deps_status}`.")
                  if err:
                      lines.append(f"- Diagnostic: `{err[:500]}`")
              if parse_error:
                  lines.append(f"- Could not parse dependency report: `{parse_error[:500]}`")
              lines.append("- Action: rerun the dependency audit manually and inspect package resolution.")
              lines.append("")

          if content_problem:
              lines.append("### Generated-content inconsistency")
              if pack_status != 0:
                  lines.append("- `tool/content_pack.py validate` failed.")
              if ingestion_status != 0:
                  lines.append("- `tool/content_ingestion.py validate` failed.")
              if compile_status != 0:
                  lines.append("- Canonical content compilation failed.")
              if parity_status not in (0, 99):
                  lines.append("- Canonical content parity check failed.")
              if drift_status not in (0, 99):
                  lines.append("- `lib/data/generated` differs from a fresh canonical compilation.")
              lines.append("- Action: regenerate and review content through the canonical pipeline; do not edit generated files by hand.")

              diff_path = Path(os.environ["GENERATED_DIFF"])
              if diff_path.exists():
                  diff_text = diff_path.read_text(encoding="utf-8", errors="replace").strip()
                  if diff_text:
                      lines.extend(["", "<details><summary>Generated diff summary</summary>", "", "```text", *diff_text.splitlines()[:40], "```", "</details>"])

          if not needs_issue:
              lines.append("- No maintenance action is required this week.")

          Path(os.environ["REPORT"]).write_text("\n".join(lines) + "\n", encoding="utf-8")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"needs_issue={'true' if needs_issue else 'false'}\n")
              output.write(f"safe_update_count={len(safe_updates)}\n")
          PY

          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update maintenance issue
        if: steps.audit.outputs.needs_issue == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          title='[Weekly Maintenance] Dependency/content findings'
          existing="$(
            gh issue list \
              --state open \
              --limit 100 \
              --json number,title \
              --jq '.[] | select(.title == "[Weekly Maintenance] Dependency/content findings") | .number' \
              | head -n 1
          )"

          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body-file weekly-maintenance-report.md
          else
            gh issue create --title "$title" --body-file weekly-maintenance-report.md
          fi

      - name: Confirm clean maintenance state
        if: steps.audit.outputs.needs_issue != 'true'
        run: echo "No safe dependency updates or generated-content inconsistencies found."
