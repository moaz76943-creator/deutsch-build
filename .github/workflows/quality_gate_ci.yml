name: Quality Gate CI (manual fallback only)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: none
  checks: none
  id-token: none
  pull-requests: none

concurrency:
  group: quality-gate-ci-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate-ci:
    name: quality-gate-ci-manual-fallback
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Read locked Flutter version
        id: toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          source toolchain.lock
          printf 'flutter=%s\n' "$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up locked Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "${{ steps.toolchain.outputs.flutter }}"
          channel: stable
          cache: false
          pub-cache: false

      - name: Install pytest
        run: python3 -m pip install --disable-pip-version-check --no-input pytest

      - name: Run canonical repository quality gate
        run: bash scripts/local_quality_gate.sh
