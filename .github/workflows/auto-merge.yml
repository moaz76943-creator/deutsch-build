name: Guarded Auto Merge

on:
  pull_request_target:
    types: [labeled, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: guarded-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable-auto-merge:
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'automerge') &&
      (
        github.event.pull_request.author_association == 'OWNER' ||
        github.event.pull_request.author_association == 'MEMBER' ||
        github.event.pull_request.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Enable protected auto-merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -Eeuo pipefail

          state="$(
            gh pr view "$PR_URL" \
              --json state,isDraft,isCrossRepository,baseRefName \
              --jq '[.state, .isDraft, .isCrossRepository, .baseRefName] | @tsv'
          )"
          IFS=$'\t' read -r pr_state is_draft is_cross base_ref <<< "$state"

          if [[ "$pr_state" != "OPEN" ||
                "$is_draft" != "false" ||
                "$is_cross" != "false" ||
                "$base_ref" != "main" ]]; then
            echo "::notice::PR state changed; auto-merge was not enabled."
            exit 0
          fi

          gh pr merge --auto --merge "$PR_URL"
