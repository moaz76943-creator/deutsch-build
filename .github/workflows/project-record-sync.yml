name: Project Record Sync

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/project-record/runtime.json
      - docs/project-record/events.ndjson
  schedule:
    - cron: "31 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: none
  checks: none
  id-token: none
  pull-requests: none

concurrency:
  group: project-record-writer
  cancel-in-progress: false

jobs:
  sync:
    name: Reconcile and update project record
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize project record from durable evidence
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PROJECT_RECORD_RUN_ID: ""
          PROJECT_RECORD_WORKFLOW: ""
          PROJECT_RECORD_CONCLUSION: ""
        run: |
          python3 tool/project_record_sync.py \
            --trigger "$GITHUB_EVENT_NAME" \
            --run-id "$PROJECT_RECORD_RUN_ID" \
            --workflow "$PROJECT_RECORD_WORKFLOW" \
            --conclusion "$PROJECT_RECORD_CONCLUSION"

      - name: Upload project record artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: project-record-sync-${{ github.run_id }}
          path: docs/project-record/
          if-no-files-found: error
          retention-days: 7
