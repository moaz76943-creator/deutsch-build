name: Project Record Sync

on:
  push:
    branches: [main, staging/v2-full-platform]
    paths-ignore:
      - docs/project-record/runtime.json
      - docs/project-record/events.ndjson
  # Event-driven push sync remains primary; one daily sweep repairs missed events.
  schedule:
    - cron: "31 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: none
  checks: none
  id-token: none
  pull-requests: none

concurrency:
  group: project-record-writer
  cancel-in-progress: false

jobs:
  sync:
    name: Reconcile and update project record
    if: >-
      github.event_name == 'workflow_dispatch' ||
      vars.GITHUB_ACTIONS_NONESSENTIAL_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize project record from durable evidence
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PROJECT_RECORD_RUN_ID: ""
          PROJECT_RECORD_WORKFLOW: ""
          PROJECT_RECORD_CONCLUSION: ""
        run: |
          python3 tool/project_record_sync.py \
            --trigger "$GITHUB_EVENT_NAME" \
            --run-id "$PROJECT_RECORD_RUN_ID" \
            --workflow "$PROJECT_RECORD_WORKFLOW" \
            --conclusion "$PROJECT_RECORD_CONCLUSION"

      - name: Upload project record artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: project-record-sync-${{ github.run_id }}
          path: docs/project-record/
          if-no-files-found: error
          retention-days: 7
