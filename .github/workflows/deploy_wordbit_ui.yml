name: "Deploy WordBit 3D Card Engine & Carousel UI"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: "بناء ودجت البطاقة التفاعلية ثلاثية الأبعاد ونظام التمرير"
        run: |
          mkdir -p lib/features/wordbit/ui lib/features/wordbit/controllers

          # 1. ودجت البطاقة التفاعلية بقلب ثلاثي الأبعاد WordBitFlipCard
          cat << 'DART' > lib/features/wordbit/ui/wordbit_flip_card.dart
          import 'dart:math' as math;
          import 'package:flutter/material.dart';
          import '../wordbit_card_model.dart';
          import '../../../core/ui/tokens/app_spacing.dart';
          import '../../../core/ui/tokens/app_motion.dart';

          class WordBitFlipCard extends StatefulWidget {
            final WordBitCardData cardData;
            final VoidCallback? onAudioTap;
            final ValueChanged<int>? onRateCard; // 1: Hard, 2: Good, 3: Easy

            const WordBitFlipCard({
              super.key,
              required this.cardData,
              this.onAudioTap,
              this.onRateCard,
            });

            @override
            State<WordBitFlipCard> createState() => _WordBitFlipCardState();
          }

          class _WordBitFlipCardState extends State<WordBitFlipCard>
              with SingleTickerProviderStateMixin {
            late AnimationController _controller;
            late Animation<double> _animation;
            bool _showFront = true;

            @override
            void initState() {
              super.initState();
              _controller = AnimationController(
                vsync: this,
                duration: AppMotion.cardFlip,
              );
              _animation = Tween<double>(begin: 0.0, end: 1.0).animate(_controller)
                ..addListener(() {
                  setState(() {
                    if (_animation.value >= 0.5 && _showFront) {
                      _showFront = false;
                    } else if (_animation.value < 0.5 && !_showFront) {
                      _showFront = true;
                    }
                  });
                });
            }

            void _toggleFlip() {
              if (_controller.isAnimating) return;
              if (_showFront) {
                _controller.forward();
              } else {
                _controller.reverse();
              }
            }

            @override
            void dispose() {
              _controller.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              final angle = _animation.value * math.pi;
              final transform = Matrix4.identity()
                ..setEntry(3, 2, AppMotion.card3dPerspective)
                ..rotateY(angle);

              return GestureDetector(
                onTap: _toggleFlip,
                child: Transform(
                  transform: transform,
                  alignment: Alignment.center,
                  child: Container(
                    margin: const EdgeInsets.symmetric(
                      horizontal: AppSpacing.lg,
                      vertical: AppSpacing.md,
                    ),
                    padding: const EdgeInsets.all(AppSpacing.xl),
                    decoration: BoxDecoration(
                      color: Theme.of(context).cardColor,
                      borderRadius: BorderRadius.circular(AppSpacing.cardRadiusLg),
                      boxShadow: [
                        BoxShadow(
                          color: Colors.black.withOpacity(0.06),
                          blurRadius: 16,
                          offset: const Offset(0, 6),
                        ),
                      ],
                      border: Border.all(
                        color: Theme.of(context).dividerColor.withOpacity(0.1),
                        width: 1.2,
                      ),
                    ),
                    child: _showFront ? _buildFrontView() : _buildBackViewTransformed(),
                  ),
                ),
              );
            }

            Widget _buildFrontView() {
              return Column(
                mainAxisAlignment: MainAxisAlignment.center,
                children: [
                  Row(
                    mainAxisAlignment: MainAxisAlignment.spaceBetween,
                    children: [
                      Container(
                        padding: const EdgeInsets.symmetric(
                          horizontal: AppSpacing.md,
                          vertical: AppSpacing.xs,
                        ),
                        decoration: BoxDecoration(
                          color: Colors.blue.withOpacity(0.08),
                          borderRadius: BorderRadius.circular(AppSpacing.cardRadiusSm),
                        ),
                        child: Text(
                          widget.cardData.partOfSpeech.toUpperCase(),
                          style: const TextStyle(
                            fontSize: 12,
                            fontWeight: FontWeight.bold,
                            color: Colors.blueAccent,
                          ),
                        ),
                      ),
                      IconButton(
                        icon: const Icon(Icons.volume_up_rounded, color: Colors.blueAccent),
                        onPressed: widget.onAudioTap,
                      ),
                    ],
                  ),
                  const Spacer(),
                  Text(
                    widget.cardData.word,
                    style: const TextStyle(
                      fontSize: 34,
                      fontWeight: FontWeight.w800,
                      letterSpacing: 0.4,
                    ),
                    textAlign: TextAlign.center,
                  ),
                  const SizedBox(height: AppSpacing.sm),
                  Text(
                    widget.cardData.ipa,
                    style: TextStyle(
                      fontSize: 16,
                      fontFamily: 'monospace',
                      color: Colors.grey.shade600,
                    ),
                  ),
                  const Spacer(),
                  Text(
                    'المس البطاقة للقلب والمعنى ↺',
                    style: TextStyle(fontSize: 12, color: Colors.grey.shade400),
                  ),
                ],
              );
            }

            Widget _buildBackViewTransformed() {
              return Transform(
                transform: Matrix4.identity()..rotateY(math.pi),
                alignment: Alignment.center,
                child: Column(
                  mainAxisAlignment: MainAxisAlignment.center,
                  children: [
                    Container(
                      padding: const EdgeInsets.symmetric(
                        horizontal: AppSpacing.md,
                        vertical: AppSpacing.xs,
                      ),
                      decoration: BoxDecoration(
                        color: Colors.green.withOpacity(0.08),
                        borderRadius: BorderRadius.circular(AppSpacing.cardRadiusSm),
                      ),
                      child: Text(
                        widget.cardData.domainName,
                        style: const TextStyle(
                          fontSize: 12,
                          fontWeight: FontWeight.w600,
                          color: Colors.green,
                        ),
                      ),
                    ),
                    const SizedBox(height: AppSpacing.md),
                    Text(
                      widget.cardData.translation,
                      style: const TextStyle(
                        fontSize: 28,
                        fontWeight: FontWeight.bold,
                      ),
                      textAlign: TextAlign.center,
                    ),
                    const SizedBox(height: AppSpacing.md),
                    Text(
                      widget.cardData.exampleSentence,
                      style: TextStyle(
                        fontSize: 15,
                        fontStyle: FontStyle.italic,
                        color: Colors.grey.shade700,
                      ),
                      textAlign: TextAlign.center,
                    ),
                    const Spacer(),
                    Row(
                      mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                      children: [
                        _ratingButton('صعب', Colors.red, () => widget.onRateCard?.call(1)),
                        _ratingButton('جيد', Colors.amber.shade800, () => widget.onRateCard?.call(2)),
                        _ratingButton('سهل', Colors.green, () => widget.onRateCard?.call(3)),
                      ],
                    ),
                  ],
                ),
              );
            }

            Widget _ratingButton(String label, Color color, VoidCallback onTap) {
              return TextButton(
                onPressed: onTap,
                style: TextButton.styleFrom(
                  foregroundColor: color,
                  padding: const EdgeInsets.symmetric(
                    horizontal: AppSpacing.md,
                    vertical: AppSpacing.xs,
                  ),
                ),
                child: Text(label, style: const TextStyle(fontWeight: FontWeight.bold)),
              );
            }
          }
          DART

          dart analyze lib/features/wordbit/ui/wordbit_flip_card.dart

      - name: "حفظ واعتماد ودجت الواجهة في المستودع"
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/
          git commit -m "feat(ui): add 3d wordbit flip card widget with 60fps gesture and srs triggers" || exit 0
          git push
