name: Trigger Signed Codemagic Build

on:
  pull_request_target:
    branches: [main, staging/v2-full-platform]
    types: [closed]

permissions:
  contents: read
  checks: read
  pull-requests: read
  actions: none
  id-token: none

concurrency:
  group: signed-codemagic-${{ github.event.pull_request.merge_commit_sha }}
  cancel-in-progress: false

jobs:
  trigger-signed-aab:
    if: >-
      github.event.pull_request.merged == true &&
      vars.GITHUB_ACTIONS_RELEASE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CODEMAGIC_WORKFLOW_ID: signed-android-aab
      CODEMAGIC_BRANCH: main

    steps:
      - name: Verify required quality gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${PR_HEAD_SHA:?Missing pull request head SHA}"

          checks_json="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/commits/${PR_HEAD_SHA}/check-runs?per_page=100")"

          if ! jq -e '
            any(
              .check_runs[];
              .name == "quality"
              and .app.slug == "github-actions"
              and .status == "completed"
              and .conclusion == "success"
            )
          ' <<<"${checks_json}" >/dev/null; then
            echo "::error::Required GitHub Actions quality gate did not complete successfully for ${PR_HEAD_SHA}."
            exit 1
          fi

          echo "Required quality gate passed for ${PR_HEAD_SHA}."

      - name: Check merge commit build directive
        id: build_guard
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${MERGE_SHA:?Missing merge commit SHA}"

          commit_message="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/commits/${MERGE_SHA}" \
            --jq '.commit.message')"

          if grep -Fqi '[skip build]' <<<"${commit_message}"; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "Codemagic build suppressed by [skip build] on ${MERGE_SHA}."
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
            echo "No [skip build] directive found on ${MERGE_SHA}."
          fi

      - name: Trigger signed AAB on Codemagic
        if: steps.build_guard.outputs.skip != 'true'
        env:
          CODEMAGIC_API_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
          CODEMAGIC_APP_ID: ${{ secrets.CODEMAGIC_APP_ID }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${CODEMAGIC_API_TOKEN:?Missing CODEMAGIC_API_TOKEN repository secret}"
          : "${CODEMAGIC_APP_ID:?Missing CODEMAGIC_APP_ID repository secret}"
          : "${MERGE_SHA:?Missing merge commit SHA}"

          payload="$(jq -cn \
            --arg appId "${CODEMAGIC_APP_ID}" \
            --arg workflowId "${CODEMAGIC_WORKFLOW_ID}" \
            --arg branch "${CODEMAGIC_BRANCH}" \
            --arg sha "${MERGE_SHA}" \
            '{
              appId: $appId,
              workflowId: $workflowId,
              branch: $branch,
              labels: ["github-merge", ("sha-" + ($sha[0:12]))]
            }')"

          response_file="$(mktemp)"
          trap 'rm -f "${response_file}"' EXIT

          http_status="$(curl \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --header "x-auth-token: ${CODEMAGIC_API_TOKEN}" \
            --data "${payload}" \
            'https://api.codemagic.io/builds')"

          if [[ "${http_status}" -lt 200 || "${http_status}" -ge 300 ]]; then
            echo "::error::Codemagic build trigger failed with HTTP ${http_status}."
            exit 1
          fi

          build_id="$(jq -r '.buildId // empty' "${response_file}")"
          if [[ -z "${build_id}" ]]; then
            echo "::error::Codemagic accepted the request but did not return a buildId."
            exit 1
          fi

          echo "Codemagic signed AAB build started successfully: ${build_id}"
