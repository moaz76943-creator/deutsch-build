name: Comprehensive Quality Check & APK Build

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  inspect_and_build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Verify Dependencies
        run: flutter pub get

      - name: 5. Code Quality & Syntax Analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 6. Build Standard Release APK
        run: flutter build apk --release

      - name: 7. Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deutsch-bilarabi-apk
          path: build/app/outputs/flutter-apk/app-release.apk
