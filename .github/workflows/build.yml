name: Build Android Debug APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/project-record/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: none
  checks: none
  id-token: none
  pull-requests: none

concurrency:
  group: build-android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Read canonical toolchain
        id: toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          source toolchain.lock
          printf 'flutter=%s\n' "$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"
          printf 'java=%s\n' "$JAVA_MAJOR" >> "$GITHUB_OUTPUT"
          printf 'gradle=%s\n' "$GRADLE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "${{ steps.toolchain.outputs.java }}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "${{ steps.toolchain.outputs.gradle }}"
          cache-disabled: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "${{ steps.toolchain.outputs.flutter }}"
          channel: stable
          cache: false
          pub-cache: false

      - name: Materialize verified Gradle wrapper
        run: python3 tool/gradle_wrapper_bootstrap.py

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Verify immutable Gradle wrapper
        run: python3 tool/gradle_wrapper_integrity.py

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect Debug APK
        shell: bash
        run: |
          set -Eeuo pipefail
          apk_path="$(find build/app/outputs -type f -name 'app-debug.apk' -print -quit)"
          test -n "$apk_path"
          mkdir -p build/artifacts
          cp "$apk_path" build/artifacts/app-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-debug-apk
          path: build/artifacts/app-debug.apk
          if-no-files-found: error
          retention-days: 7
