name: Flutter Build & Analyze Gate

on:
  push:
    branches: [ main, staging/v2-full-platform ]
  pull_request:
    branches: [ main, staging/v2-full-platform ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Install Dependencies
      run: flutter pub get

    - name: Run Static Analysis
      run: dart analyze --no-fatal-warnings lib/

    - name: Run Release Preflight
      run: python3 deutsch_release_preflight.py

    - name: Run Targeted Core Tests
      run: flutter test test/core/database/bootstrap/database_bootstrapper_test.dart test/services/delta_patch_service_test.dart test/services/srs_scheduler_persisted_counter_integrity_test.dart test/jules/WS16/ test/offline_gate_test.dart

