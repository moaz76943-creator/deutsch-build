name: Flutter Build & Analyze Gate

on:
  # Explicit manual verification only; private runner minutes must not
  # be consumed automatically when routine PRs/pushes arrive.
  # Manual staging verification requires this workflow to be valid on the default
  # main branch too; staging changes alone do not register workflow_dispatch.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Read locked Flutter version
      id: toolchain
      shell: bash
      run: |
        set -Eeuo pipefail
        source toolchain.lock
        printf 'flutter=%s\n' "$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"

    - name: Validate all GitHub Actions workflow contracts
      run: python3 -m unittest discover -s tests -p 'test_workflow_conflict_recovery.py' -v

    - name: Set up Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      with:
        flutter-version: "${{ steps.toolchain.outputs.flutter }}"
        channel: 'stable'

    - name: Install Dependencies
      run: flutter pub get --enforce-lockfile

    - name: Run Static Analysis
      run: dart analyze lib/

    - name: Run Release Preflight
      run: python3 deutsch_release_preflight.py

    - name: Run Targeted Core Tests
      run: flutter test test/core/database/bootstrap/database_bootstrapper_test.dart test/services/delta_patch_service_test.dart test/services/srs_scheduler_persisted_counter_integrity_test.dart test/services/lemmatization_service_test.dart test/jules/J049/trie_search_engine_test.dart test/jules/WS16/ test/offline_gate_test.dart

    - name: Run Unit Tests
      run: flutter test
