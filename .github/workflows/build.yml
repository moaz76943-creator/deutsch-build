name: Autonomous Master Pipeline & Release

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  master_build_pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Java 17 Runtime
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. Setup Flutter Stable SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Verify & Fetch Dependencies
        run: flutter pub get

      - name: 5. Code Quality & Syntax Analysis
        run: |
          mkdir -p build_audit
          flutter analyze --no-fatal-infos --no-fatal-warnings > build_audit/lint_analysis.txt || true

      - name: 6. Assets & Content Integrity Audit
        run: |
          echo "=== ASSETS AUDIT ===" > build_audit/assets_audit.txt
          find assets -type f >> build_audit/assets_audit.txt 2>/dev/null || true

      - name: 7. Build Universal Production Release APK
        run: flutter build apk --release

      - name: 8. Build High Performance Split APKs
        run: flutter build apk --release --split-per-abi

      - name: 9. Upload Production Packages & Audit Reports
        uses: actions/upload-artifact@v4
        with:
          name: deutsch-bilarabi-full-package
          path: |
            build/app/outputs/flutter-apk/*.apk
            build_audit/*
