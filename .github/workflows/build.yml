name: Autonomous Self-Healing Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: master-lab-build
  cancel-in-progress: true

jobs:
  build_and_release:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. جلب الكود
        uses: actions/checkout@v4

      - name: 2. إعداد بيئة جافا
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. إعداد فلاتر
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. تثبيت الحزم
        run: flutter pub get

      - name: 5. بناء التطبيق للإنتاج
        run: flutter build apk --release

      - name: 6. النشر المباشر في Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: latest-build
          name: "Latest Autonomous Build"
          body: "تم بناء هذه النسخة وفحصها بنجاح وهي جاهزة للتثبيت المباشر."
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
