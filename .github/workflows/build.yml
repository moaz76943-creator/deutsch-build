name: Flutter Build & Analyze Gate

# Manual-only to avoid spending hosted runner minutes for each branch update.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Verify pinned Gradle wrapper before downloading SDKs
        run: python3 tool/gradle_wrapper_integrity.py

      - name: Read locked Flutter toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          source toolchain.lock
          printf 'flutter=%s\n' "$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.toolchain.outputs.flutter }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Show toolchain versions
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check Dart compile-blocking errors
        run: bash scripts/check-dart-errors.sh

      - name: Run Unit Tests
        run: flutter test
