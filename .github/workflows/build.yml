name: Flutter Build & Analyze Gate

on:
  push:
    branches: [ main, staging/v2-full-platform ]
  pull_request:
    branches: [ main, staging/v2-full-platform ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'
        channel: 'stable'

    - name: Install Dependencies
      run: flutter pub get

    - name: Run Static Analysis
      run: dart analyze lib/

    - name: Run Unit Tests
      run: flutter test
