name: Flutter Build & Analyze Gate

on:
  push:
    branches: [ main, staging/v2-full-platform ]
  pull_request:
    branches: [ main, staging/v2-full-platform ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Prepare Bundled Content Assets
      run: |
        mkdir -p assets/content/packs/de/sqlite assets/content/packs/ar/sqlite
        python3 -c "import gzip, shutil; shutil.copyfileobj(gzip.open('assets/content/packs/de/bundles/de-1.0.0.pack.gz', 'rb'), open('assets/content/packs/de/sqlite/de-1.0.0.sqlite', 'wb'))"
        python3 -c "import gzip, shutil; shutil.copyfileobj(gzip.open('assets/content/packs/ar/bundles/ar-1.0.0.pack.gz', 'rb'), open('assets/content/packs/ar/sqlite/ar-1.0.0.sqlite', 'wb'))"
        python3 scripts/ensure_bundled_offline_assets.py

    - name: Install Dependencies
      run: flutter pub get

    - name: Run Static Analysis
      run: dart analyze --no-fatal-warnings lib/

    - name: Run Release Preflight
      run: python3 deutsch_release_preflight.py

    - name: Run Targeted Core Tests
      run: flutter test test/core/database/bootstrap/database_bootstrapper_test.dart test/services/delta_patch_service_test.dart test/services/srs_scheduler_persisted_counter_integrity_test.dart test/services/lemmatization_service_test.dart test/jules/J049/trie_search_engine_test.dart test/jules/J010/directed_readiness_test.dart test/jules/J028/directed_pair_id_test.dart test/jules/J028/operation_result_test.dart test/jules/J054/semantic_color_tagging_test.dart test/offline_recovery/bootstrap_missing_pack_recovery_test.dart test/jules/J003/pack_admission_test.dart test/jules/WS16/ test/offline_gate_test.dart

