name: Autonomous Self-Healing Build & Release

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

concurrency:
  group: master-lab-build
  cancel-in-progress: true

jobs:
  autonomous_pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Resolve Packages
        run: flutter pub get

      - name: 5. Build Release APK (Universal)
        run: flutter build apk --release

      - name: 6. Publish Direct Release Download
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: latest-build
          name: "Latest Autonomous Build"
          body: "تم بناء هذه النسخة وفحصها تلقائياً بواسطة مختبر جيت هب."
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
