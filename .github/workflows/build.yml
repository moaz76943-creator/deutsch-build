name: Deutsch Bi-Arabi Autonomous Engineering & Build Lab

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autonomous_lab:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Full Repository
        uses: actions/checkout@v4

      - name: 2. Setup Java 17 Runtime
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. Setup Flutter Stable SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Verify & Fetch Dependencies
        run: flutter pub get

      - name: 5. Code Quality, UI Lint & Architecture Analysis
        run: |
          mkdir -p lab_reports
          flutter analyze --no-fatal-infos --no-fatal-warnings > lab_reports/code_quality.txt || true

      - name: 6. Audio Assets & Lesson Dictionary Audit
        run: |
          echo "=== ASSETS & SOUND INTEGRITY AUDIT ===" > lab_reports/assets_audit.txt
          echo "Total files in assets:" >> lab_reports/assets_audit.txt
          find assets -type f | wc -l >> lab_reports/assets_audit.txt 2>/dev/null || true
          echo "" >> lab_reports/assets_audit.txt
          echo "Audio Files Found:" >> lab_reports/assets_audit.txt
          find assets -name "*.mp3" -o -name "*.wav" -o -name "*.ogg" 2>/dev/null >> lab_reports/assets_audit.txt || true

      - name: 7. Build Universal Production Release APK
        run: flutter build apk --release

      - name: 8. Build Performance Optimized Split APKs
        run: flutter build apk --release --split-per-abi

      - name: 9. Bundle and Upload All APKs & Engineering Reports
        uses: actions/upload-artifact@v4
        with:
          name: deutsch-bilarabi-full-suite
          path: |
            build/app/outputs/flutter-apk/*.apk
            lab_reports/*
