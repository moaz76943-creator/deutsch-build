name: "Build Production Release APK"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: جلب كود المستودع
        uses: actions/checkout@v4

      - name: إعداد بيئة جافا (Java JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: إعداد بيئة Dart و Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: تجهيز مسارات الأصول وحزم المشروع
        run: |
          mkdir -p assets/audio assets/images
          touch assets/audio/.gitkeep assets/images/.gitkeep
          flutter pub get

      - name: تجميع وبناء ملف الـ APK (Release)
        run: |
          flutter build apk --release

      - name: رفع ملف الـ APK النهائي لتنزيله مباشرة
        uses: actions/upload-artifact@v4
        with:
          name: Deutsch-Bilarabi-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
