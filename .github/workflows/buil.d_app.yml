name: "استخراج ملف التثبيت (APK) لتحميله وتجربته على الهاتف"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: جلب كود المستودع
        uses: actions/checkout@v4

      - name: إعداد بيئة جافا (Java JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: إعداد بيئة Dart و Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: تجهيز مسارات الأصول وحزم المشروع
        run: |
          mkdir -p assets/audio assets/images
          touch assets/audio/.gitkeep assets/images/.gitkeep
          flutter pub get

      - name: توليد مفتاح التوقيع الرقمي وإعدادات Gradle تلقائياً
        run: |
          mkdir -p "$HOME/.gradle"

          # 1. تشغيل سكربت التوقيع المحلي إن وُجد
          if [ -f "scripts/local-release.sh" ]; then
            chmod +x scripts/local-release.sh
            bash scripts/local-release.sh || true
          fi

          # 2. إنشاء مفتاح التوقيع الرقمي المطلوب
          if [ ! -f "$HOME/.gradle/release-key.jks" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.gradle/release-key.jks" \
              -alias releaseKey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=DeutschApp, OU=Mobile, O=App, L=Amman, S=Amman, C=JO"
          fi

          # نسخ المفتاح أيضاً داخل مجلد android/app احتياطاً
          mkdir -p android/app
          cp "$HOME/.gradle/release-key.jks" android/app/release-key.jks || true

          # 3. تغذية Gradle بكافة بيانات المفتاح المطلوبة
          cat << 'EOF' > "$HOME/.gradle/gradle.properties"
          releaseKeystoreFile=/home/runner/.gradle/release-key.jks
          releaseKeyAlias=releaseKey
          releaseKeyPassword=android
          releaseKeystorePassword=android
          EOF

          cat << 'EOF' >> "android/gradle.properties"
          releaseKeystoreFile=/home/runner/.gradle/release-key.jks
          releaseKeyAlias=releaseKey
          releaseKeyPassword=android
          releaseKeystorePassword=android
          EOF

          cat << 'EOF' > "android/key.properties"
          releaseKeystoreFile=/home/runner/.gradle/release-key.jks
          releaseKeyAlias=releaseKey
          releaseKeyPassword=android
          releaseKeystorePassword=android
          storeFile=/home/runner/.gradle/release-key.jks
          keyAlias=releaseKey
          keyPassword=android
          storePassword=android
          EOF

      - name: تجميع وبناء ملف الـ APK (Release)
        run: |
          flutter build apk --release

      - name: رفع ملف الـ APK النهائي لتنزيله مباشرة
        uses: actions/upload-artifact@v4
        with:
          name: Deutsch-Bilarabi-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
