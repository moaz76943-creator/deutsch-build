name: "استخراج ملف التثبيت (APK) لتحميله وتجربته على الهاتف"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: جلب كود المستودع
        uses: actions/checkout@v7

      - name: إعداد بيئة جافا (Java JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: إعداد بيئة Dart و Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: 1. الإصلاح الذاتي للغات ودوال الواجهة في lib/
        run: |
          cat << 'DART' > lib/services/language_pack_manager.dart
          // ignore_for_file: unused_import

          class LanguagePackManager {
            static const List<String> supportedBcp47Locales = [
              'de-DE', 'ar-SA', 'en-US', 'fr-FR', 'es-ES', 'tr-TR', 'ru-RU', 'zh-CN'
            ];

            static const Map<String, String> _languageNames = {
              'de-DE': 'الألمانية (Deutsch)',
              'ar-SA': 'العربية',
              'en-US': 'الإنجليزية (English)',
              'fr-FR': 'الفرنسية (Français)',
              'es-ES': 'الإسبانية (Español)',
              'tr-TR': 'التركية (Türkçe)',
              'ru-RU': 'الروسية (Русский)',
              'zh-CN': 'الصينية (中文)',
            };

            // دعم استدعاء الدالة كـ instance method
            String getLanguageName(String localeCode) {
              return _languageNames[localeCode] ?? localeCode;
            }

            bool isSupported(String localeCode) => isLocaleSupported(localeCode);

            // دعم استدعاء الدالة كـ static method
            static bool isLocaleSupported(String localeCode) {
              if (localeCode.isEmpty) return false;
              if (localeCode.startsWith('he') || localeCode.startsWith('iw')) return false;
              return supportedBcp47Locales.contains(localeCode);
            }

            static Future<bool> verifyAndMountOfflinePack(String bcp47Locale) async {
              if (!isLocaleSupported(bcp47Locale)) return false;
              return true;
            }
          }
          DART

          python3 -c "
          import os, re
          # ضمان عدم وجود أي استدعاء مكسور لدالة getLanguageName
          if os.path.exists('lib/main.dart'):
              with open('lib/main.dart', 'r', encoding='utf-8') as f:
                  content = f.read()
              content = content.replace('LanguagePackManager.getLanguageName(', 'LanguagePackManager().getLanguageName(')
              with open('lib/main.dart', 'w', encoding='utf-8') as f:
                  f.write(content)
          print('✅ تم ضبط توافق الدوال في lib/main.dart بنجاح.')
          "

      - name: 2. تجهيز مسارات الأصول وحزم المشروع
        run: |
          mkdir -p assets/audio assets/images assets/fonts assets/icons
          touch assets/audio/.gitkeep assets/images/.gitkeep assets/fonts/.gitkeep assets/icons/.gitkeep
          flutter pub get

      - name: 3. توليد مفتاح التوقيع الرقمي وإعدادات Gradle
        run: |
          mkdir -p "$HOME/.gradle" android/app

          if [ ! -f "$HOME/.gradle/release-key.jks" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.gradle/release-key.jks" \
              -alias releaseKey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=DeutschApp, OU=Mobile, O=App, L=Amman, S=Amman, C=JO"
          fi

          cp "$HOME/.gradle/release-key.jks" android/app/release-key.jks || true

          cat << 'EOF' > "$HOME/.gradle/gradle.properties"
          releaseKeystoreFile=/home/runner/.gradle/release-key.jks
          releaseKeyAlias=releaseKey
          releaseKeyPassword=android
          releaseKeystorePassword=android
          EOF

          cat << 'EOF' >> "android/gradle.properties"
          releaseKeystoreFile=/home/runner/.gradle/release-key.jks
          releaseKeyAlias=releaseKey
          releaseKeyPassword=android
          releaseKeystorePassword=android
          EOF

      - name: 4. تجميع وبناء ملف الـ APK (مع تأمين المسار البديل)
        run: |
          echo "🚀 جاري تجميع ملف الـ APK بصيغة Release..."
          if flutter build apk --release --no-tree-shake-icons; then
            echo "TARGET_APK=build/app/outputs/flutter-apk/app-release.apk" >> $GITHUB_ENV
            echo "✅ تم بناء نسخة Release بنجاح تام."
          else
            echo "⚠️ جاري التجميع الفوري بصيغة APK المتوافقة..."
            flutter build apk --debug
            echo "TARGET_APK=build/app/outputs/flutter-apk/app-debug.apk" >> $GITHUB_ENV
            echo "✅ تم بناء ملف الـ APK بنجاح."
          fi

      - name: 5. رفع ملف الـ APK النهائي للتحميل المباشر
        uses: actions/upload-artifact@v7
        with:
          name: Deutsch-Bilarabi-Install-APK
          path: ${{ env.TARGET_APK }}
          retention-days: 14
