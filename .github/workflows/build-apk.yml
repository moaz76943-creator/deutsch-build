name: Build Release APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/project-record/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: none
  checks: none
  id-token: none
  pull-requests: none

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    # isPrivate gate: removed private repo restriction to allow manual and main branch triggers
    if: github.event_name != 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read toolchain.lock
        id: toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          source toolchain.lock
          printf 'flutter=%s\n' "$FLUTTER_VERSION" >> "$GITHUB_OUTPUT"
          printf 'java=%s\n' "$JAVA_MAJOR" >> "$GITHUB_OUTPUT"
          printf 'gradle=%s\n' "$GRADLE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "${{ steps.toolchain.outputs.java }}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "${{ steps.toolchain.outputs.gradle }}"
          cache-disabled: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "${{ steps.toolchain.outputs.flutter }}"
          channel: stable
          cache: true

      - name: Materialize verified Gradle wrapper
        run: python3 tool/gradle_wrapper_bootstrap.py

      - name: Verify immutable Gradle wrapper
        run: python3 tool/gradle_wrapper_integrity.py

      - name: Run release quality gates
        run: |
          python3 tool/v233_build_path_compatibility.py
          python3 tool/privacy_audit.py
          python3 tool/security_audit.py
          python3 tool/quality_audit.py
          python3 tool/accessibility_audit.py
          python3 tool/architecture_audit.py
          python3 tool/weakness_gate.py
          python3 tool/content_pack.py validate
          python3 tool/content_ingestion.py validate
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          python3 tool/content_compiler.py compile --output-dir "$tmp_dir/generated"
          python3 tool/content_compiler.py parity --output-dir "$tmp_dir/generated"

      - name: Materialize release signing material
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          chmod 600 android/app/upload-keystore.jks

      - name: Build and verify release APK
        env:
          ORG_GRADLE_PROJECT_releaseStoreFile: android/app/upload-keystore.jks
          ORG_GRADLE_PROJECT_releaseStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_releaseKeyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_releaseKeyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./scripts/build.sh release

      - name: Upload private release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Remove CI-owned signing material
        if: always()
        run: rm -f android/app/upload-keystore.jks
