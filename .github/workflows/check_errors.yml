name: "الفحص الشامل للأخطاء (بدون بناء)"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-code:
    runs-on: ubuntu-latest
    steps:
      - name: جلب كود المستودع
        uses: actions/checkout@v7

      - name: إعداد بيئة Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: تنظيف وتنزيل الحزم
        run: |
          flutter clean
          flutter pub get

      - name: فحص الكود الشامل (Static Analysis)
        run: flutter analyze
