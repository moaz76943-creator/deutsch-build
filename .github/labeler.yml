app-runtime:
  - changed-files:
      - any-glob-to-any-file:
          - 'lib/**'

android:
  - changed-files:
      - any-glob-to-any-file:
          - 'android/**'

content-data:
  - changed-files:
      - any-glob-to-any-file:
          - 'assets/**'
          - 'content/**'
          - 'data/**'

tests:
  - changed-files:
      - any-glob-to-any-file:
          - 'test/**'
          - 'tests/**'

automation:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - 'scripts/**'
          - 'tool/**'
          - 'analysis_options.yaml'

store-release:
  - changed-files:
      - any-glob-to-any-file:
          - 'fastlane/**'
          - 'android/fastlane/**'
          - 'store_assets/**'
          - 'codemagic.yaml'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'pubspec.yaml'
          - 'pubspec.lock'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - '**/*.md'

localization:
  - changed-files:
      - any-glob-to-any-file:
          - 'lib/l10n/**'
          - 'assets/l10n/**'
          - 'fastlane/metadata/android/**'

security-sensitive:
  - changed-files:
      - any-glob-to-any-file:
          - 'android/app/src/main/AndroidManifest.xml'
          - 'tool/security_audit.py'
          - '.github/workflows/security_audit.yml'
