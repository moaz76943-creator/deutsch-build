name: "🐛 تقرير خطأ تقني"
description: الإبلاغ عن مشكلة برمجية بدقة
body:
  - type: dropdown
    id: scope
    attributes:
      label: "مجال المشكلة (Scope)"
      options:
        - "Core / Engine"
        - "SQLite / SRS"
        - "Audio / Dispatcher"
        - "UI / Localization"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "وصف الخطأ"
    validations:
      required: true
