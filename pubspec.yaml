name: deutsch_bilarabi
description: "Offline-first German learning application in Arabic."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  uuid: ^4.4.0
  shared_preferences: ^2.2.2
  flutter_tts: ^3.8.5
  path_provider: ^2.1.2
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.3+1
  # Native SQLite binary for ffi consumers; sqflite itself uses OS SQLite.
  # Pin to the last native-bundling release (0.6.0+eol bundles nothing).
  sqlite3_flutter_libs: 0.5.42
  path: ^1.9.0
  crypto: ^3.0.7
  encrypt: ^5.0.3
  http: ^1.6.0

  archive: ^4.3.0
  flutter_animate: any
  font_awesome_flutter: any

dev_dependencies:
  custom_lint: ^0.6.0
  custom_lint_builder: ^0.6.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  sqflite_common_ffi: any

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/data/
    - assets/data/packs/
    - assets/data/master_vocabulary.json
    - assets/content/packs/de/sqlite/de-1.0.0.sqlite
    - assets/
