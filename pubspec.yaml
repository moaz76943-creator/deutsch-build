name: deutsch_bilarabi
description: Deutsch بالعربي - منصة تعلم الألمانية للعرب.
publish_to: "none"
version: 3.3.10+133
environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5
  flutter_tts: ^4.2.5
  http: ^1.6.0
  speech_to_text: ^7.5.0
  sqflite: ^2.4.4
  sqflite_common: ^2.5.13
  sqflite_sqlcipher: ^3.4.1
  path: ^1.9.1
  cryptography: ^2.9.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  percent_indicator: ^4.2.5
  font_awesome_flutter: ^11.0.0
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  sqflite_common_ffi: ^2.4.3
  mockito: ^5.8.1
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  assets:
    - content/german/audio_manifest.json
    - content/german/audio/
    - assets/media/assets_manifest.json
    - assets/media/images/
    - assets/l10n/explain_why/
    - assets/fonts/OFL-Cairo.txt
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/icon.png
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/icon.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#FFFFFF"
    image: assets/images/icon.png
