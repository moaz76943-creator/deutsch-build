name: deutsch_bilarabi
description: "Offline-first German learning application in Arabic."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  uuid: ^4.6.0
  shared_preferences: ^2.5.6
  flutter_tts: ^3.8.5
  path_provider: ^2.1.6
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.2+1
  path: ^1.9.1
  crypto: ^3.0.7
  http: ^1.6.0

  archive: ^4.5.1
  flutter_animate: ^4.5.2
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  custom_lint: ^0.6.4
  custom_lint_builder: ^0.6.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

  sqflite_common_ffi: ^2.4.0+3

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/data/packs/
    - assets/data/master_vocabulary.json
    - assets/
