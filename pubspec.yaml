name: deutsch_bilarabi
description: "Offline-first German learning application in Arabic."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  uuid: ^4.4.0
  shared_preferences: ^2.2.2
  flutter_tts: ^3.8.5
  path_provider: ^2.1.2
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.3+1
  path: any
  crypto: ^3.0.7
  http: ^1.6.0

  archive: any
  flutter_animate: any
  font_awesome_flutter: any
  cached_network_image: ^3.4.1

  synchronized: any
dev_dependencies:
  custom_lint: ^0.6.0
  custom_lint_builder: ^0.6.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  sqflite_common_ffi: any

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/data/packs/
    - assets/data/master_vocabulary.json
    - assets/
