name: deutsch_bilarabi
description: "Offline-first German learning application in Arabic."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  flutter_tts: ^3.8.5
  path_provider: ^2.1.2
  flutter_riverpod: ^2.5.1
  sqflite: ^2.4.4+1
  path: any
  crypto: ^3.0.7
  http: ^1.6.0
  cached_network_image: ^4.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/packs/
    - assets/data/master_vocabulary.json
    - assets/
